<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="เกมกระดานรถไฟสายเหนือ เล่นกับเพื่อนออนไลน์หรือกับบอท">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}html,body{height:100%}</style>
<title>รถไฟเศรษฐีไทย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mali:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen pass-and-play board — scrollable rail map on top, operator panel below on phones; panel becomes a right column on tablets */
:root{
  --bg:#E7ECE4; --surface:#FFFFFF; --surface-2:#F3F6F1; --ink:#17232B; --muted:#5A6A6E; --line:#CBD4CC;
  --rail:#1F4E9C; --accent:#F2B705; --accent-ink:#2B2100; --bus:#9AA29A; --new:#E2711D;
  --plus:#2F6FDE; --minus:#D94335; --card:#E0A800; --field-n:#DFEBD8; --field-c:#EFEADB; --field-e:#DCEAF0; --field-w:#E9E3EF; --lbl-e:#4E86A0; --lbl-w:#8670A0;
  --shadow:0 10px 30px rgba(20,35,40,.18);
  --font-d:'Mitr','Sukhumvit Set',Thonburi,'Noto Sans Thai',sans-serif;
  --font-b:'IBM Plex Sans Thai','Sukhumvit Set',Thonburi,'Noto Sans Thai',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F171B; --surface:#18232A; --surface-2:#1E2B32; --ink:#E6EDE9; --muted:#97A6A4; --line:#2C3A41;
  --rail:#6F9BEB; --accent:#F2B705; --accent-ink:#2B2100; --bus:#5D6964; --new:#F08A3C;
  --plus:#4F87EB; --minus:#EA6150; --card:#E0A800; --field-n:#15231A; --field-c:#211E16; --field-e:#13222A; --field-w:#1F1A26; --lbl-e:#7FB3CC; --lbl-w:#B19BCB;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F171B; --surface:#18232A; --surface-2:#1E2B32; --ink:#E6EDE9; --muted:#97A6A4; --line:#2C3A41;
  --rail:#6F9BEB; --accent:#F2B705; --accent-ink:#2B2100; --bus:#5D6964; --new:#F08A3C;
  --plus:#4F87EB; --minus:#EA6150; --card:#E0A800; --field-n:#15231A; --field-c:#211E16; --field-e:#13222A; --field-w:#1F1A26; --lbl-e:#7FB3CC; --lbl-w:#B19BCB;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,[data-node]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}

/* top bar */
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-family:var(--font-d);font-weight:600;font-size:18px;color:var(--rail);margin-right:auto;white-space:nowrap}
@media (max-width:520px){.brand{font-size:0;margin-right:auto}.brand::before{content:"";}.top{flex-wrap:nowrap;gap:6px}.chip{padding:5px 9px;font-size:13px}.chip.dest{min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;display:block}.iconbtn{flex:none;width:36px;height:36px}#netChip{flex:none;padding:5px 8px}#netChip .t{display:none}.chip.dest .lbl,.chip.dest .ml{display:none}.chip.dest::before{content:"⚑ ";color:#C8361E}.chip .yl{display:none}.top>.chip{padding:5px 8px}.iconbtn{width:34px;height:34px}.top{gap:5px}}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13.5px;white-space:nowrap}
.chip b{font-family:var(--font-d);font-weight:500}
.chip.dest{border-color:#C8361E}
.chip.dest b{color:#C8361E}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}

/* stage */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.mapwrap{flex:1;min-height:180px;position:relative}
.map{position:absolute;inset:0;overflow:auto;border-radius:16px;background:var(--field-c);border:1px solid var(--line);overscroll-behavior:contain}
.map svg{display:block;margin:0 auto}
.zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:20px;font-weight:600;box-shadow:var(--shadow)}
.panel{flex:none;max-height:48%;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:2px}
@media (min-width:860px){
  .stage{flex-direction:row}
  .panel{width:370px;max-height:none}
}

/* board svg */
.stn-ring{fill:var(--surface);stroke:var(--ink);stroke-width:1.3}
.stn-num{font-family:var(--font-d);font-weight:600;font-size:5px;fill:var(--rail)}
.stn-name{font-family:var(--font-d);font-weight:500;font-size:6px;fill:var(--ink)}
.rail{stroke:var(--rail);stroke-width:2.8}
.bus{stroke:var(--bus);stroke-width:1.2;stroke-dasharray:.6 1.7;stroke-linecap:round}
.fut{stroke:var(--new);stroke-width:2.3;stroke-dasharray:3 2;opacity:.75}
svg.newrail .fut{stroke-dasharray:none;opacity:1}
svg.newrail .barrier{display:none}
.reach{fill:var(--accent);fill-opacity:.25;stroke:var(--accent);stroke-width:1.4;cursor:pointer;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{fill-opacity:.55}}
.tok{transition:transform .17s ease-out}
.tok.active circle.body{stroke-width:1.4}
.tok .halo{fill:none;stroke-width:1;opacity:.0}
.tok.active .halo{opacity:.9;animation:halo 1.2s ease-out infinite}
@keyframes halo{0%{r:3.4;opacity:.9}100%{r:7;opacity:0}}
.destflag{pointer-events:none}
.stn-hit{fill:transparent;cursor:pointer}

/* panel */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.who{display:flex;align-items:center;gap:10px}
.who .tokbig{width:34px;height:34px;flex:none}
.who .nm{font-family:var(--font-d);font-weight:500;font-size:17px;line-height:1.2}
.who .sub{font-size:13px;color:var(--muted)}
.money{margin-left:auto;text-align:right}
.money b{font-family:var(--font-d);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.money small{display:block;font-size:12px;color:var(--muted)}
.neg{color:var(--minus)}
.prompt{margin-top:8px;font-size:14px;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{min-height:48px;padding:0 16px;border-radius:12px;font-family:var(--font-d);font-weight:500;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1;background:var(--surface-2);border:1px solid var(--line)}
.btn.primary{background:var(--rail);border-color:var(--rail);color:#fff}
.btn.gold{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.dice{display:flex;gap:8px;justify-content:center;margin-top:10px}
.die{width:46px;height:46px;border-radius:11px;background:var(--surface);border:2px solid var(--ink);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:6px}
.die i{width:8px;height:8px;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pick{min-height:42px;padding:0 12px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-family:var(--font-d);font-weight:500}
.pick small{font-family:var(--font-b);font-weight:400;opacity:.8;margin-left:4px}
.hand{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mini{font-size:12.5px;background:#FFF3C4;color:#4A3A00;border-radius:7px;padding:2px 8px}
.ghostb{font-size:12.5px;background:#EDE5F7;color:#4A2F78;border-radius:7px;padding:2px 8px}
.label{font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:600}
.board-list{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.prow{display:grid;grid-template-columns:14px 1fr auto auto;gap:8px;align-items:center;padding:7px 6px;border-radius:10px;text-align:left;width:100%}
.prow:hover{background:var(--surface-2)}
.prow.cur{background:var(--surface-2)}
.dot{width:12px;height:12px;border-radius:50%}
.prow .n{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .v{font-variant-numeric:tabular-nums;font-size:14px;text-align:right}
.prow .a{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);text-align:right;min-width:62px}
.log{display:flex;flex-direction:column;gap:3px;margin-top:6px;font-size:13px}
.log div{color:var(--muted)}
.log div:first-child{color:var(--ink)}

/* modal */
[hidden]{display:none!important}
.modal-wrap{position:fixed;inset:0;background:rgba(10,18,22,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (min-width:600px){.modal-wrap{align-items:center}}
.modal{background:var(--surface);color:var(--ink);border-radius:20px;box-shadow:var(--shadow);width:100%;max-width:460px;max-height:86%;overflow:auto;padding:18px 18px 16px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:0}}
.modal h3{font-family:var(--font-d);font-weight:600;font-size:21px;line-height:1.25;text-wrap:balance}
.modal .eyebrow{font-size:12px;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:2px}
.modal .body{margin-top:8px;font-size:15px}
.modal .body p+p{margin-top:6px}
.modal .actions{margin-top:16px}
.big-num{font-family:var(--font-d);font-weight:600;font-size:34px;line-height:1.1}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.prop{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.prop .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.prop .pn{font-weight:600;font-size:14.5px;line-height:1.25}
.prop .pm{font-size:12.5px;color:var(--muted)}
.prop .btn{flex:none;min-height:40px;font-size:14px;padding:0 12px}
.owner-tag{font-size:12.5px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.seg{display:flex;gap:6px;margin-top:6px}
.seg button{flex:1;min-height:44px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--font-d)}
.seg button[aria-pressed="true"]{background:var(--rail);border-color:var(--rail);color:#fff}
.field{margin-top:12px}
.names{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.names label{display:flex;align-items:center;gap:8px}
.names input{flex:1;min-width:0;min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:0 10px;font:inherit}
table.rep{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
table.rep td,table.rep th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.rep td:first-child,table.rep th:first-child{text-align:left}
table.rep th{font-size:12px;color:var(--muted);font-weight:600}
.rules li{margin:4px 0 4px 18px}
/* game cards (fixed look in both themes, like printed cards) */
.gc{--c:#FF8A3D;--cl:#FFE3CC;--cl2:#FFD3B0;width:260px;height:363px;box-sizing:border-box;background:var(--c);border:3px solid #2A2238;border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 #2A2238;color:#2A2238;font-family:'Mali',var(--font-b);flex:none;text-align:left}
.gc-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.gc-pill{background:#fff;border:2px solid #2A2238;border-radius:999px;padding:1px 10px;font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-dark{background:#2A2238;color:#fff;border-radius:999px;padding:2px 9px;font-weight:700;font-size:11px;white-space:nowrap}
.gc-art{height:178px;border:3px solid #2A2238;border-radius:13px;overflow:hidden;background:repeating-linear-gradient(135deg,var(--cl) 0 12px,var(--cl2) 12px 24px);display:grid;place-items:center;flex:none}
.gc-art.short{height:150px}
.gc-art img{width:100%;height:100%;object-fit:cover;display:block}
.gc-ph{background:rgba(255,255,255,.85);border:2px dashed #2A2238;border-radius:8px;padding:2px 8px;font-size:11px;font-weight:600}
.gc-name{margin-top:-22px;align-self:center;position:relative;background:#fff;border:3px solid #2A2238;border-radius:12px;padding:1px 14px;font-family:var(--font-d);font-weight:600;font-size:18px;line-height:1.3;box-shadow:0 3px 0 #2A2238;max-width:94%;text-align:center}
.gc-name.big{font-size:24px}
.gc-name.dark{background:#2A2238;color:#fff;box-shadow:0 3px 0 #EDE5FF}
.gc-panel{flex:1;background:#fff;border:2px solid #2A2238;border-radius:13px;padding:7px 10px;display:flex;flex-direction:column;justify-content:center;gap:5px;font-size:13.5px;font-weight:700;line-height:1.35;min-height:0;overflow:hidden}
.gc-panel.center{align-items:center;text-align:center}
.gc-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gc-stat{background:#fff;border:2px solid #2A2238;border-radius:12px;padding:3px 6px;display:flex;align-items:center;gap:6px;line-height:1.15}
.gc-coin{width:30px;height:30px;flex:none;border-radius:50%;background:#FFD84D;border:2px solid #2A2238;display:grid;place-items:center;font-family:var(--font-d);font-weight:600;font-size:13px}
.gc-coin.lg{width:54px;height:54px;font-size:21px;box-shadow:inset 0 0 0 3px #FFEFA3}
.gc-stat small,.gc-sub{display:block;font-size:10.5px;color:#6B5E7A;font-weight:700}
.gc-stat b{font-size:12px}
.gc-foot{margin-top:auto;text-align:center;font-size:10.5px;font-weight:700;display:flex;justify-content:center;align-items:center;gap:4px}
.gc-dot{width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #2A2238}
.gc-num{display:inline-grid;place-items:center;flex:none;min-width:22px;height:22px;border-radius:999px;background:#EDE5FF;border:2px solid #2A2238;font-size:12px;padding:0 4px;margin-right:6px}
.gc-line{display:flex;align-items:center}
.gc-wrap{display:flex;justify-content:center;margin:4px 0 10px}
.gc-row{display:flex;gap:12px;overflow-x:auto;padding:4px 4px 10px;scroll-snap-type:x mandatory;margin:8px -4px 0}
.gc-col{display:flex;flex-direction:column;gap:8px;align-items:center;scroll-snap-align:center;flex:none}
.gc-col .btn{width:100%;flex:none}
.art-file{display:block;width:100%;margin-top:10px;font:inherit}
/* card pop-up effects */
.gc-wrap,.gc-row{perspective:900px}
.gc{position:relative;transform-origin:50% 60%}
.gc-wrap{position:relative;isolation:isolate}
.gc-wrap::before{content:"";position:absolute;left:50%;top:50%;width:440px;height:440px;margin:-220px 0 0 -220px;border-radius:50%;background:repeating-conic-gradient(rgba(255,216,77,.6) 0 9deg,transparent 9deg 22deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 25%,transparent 68%);animation:gcBurst 1.5s ease-out both;pointer-events:none;z-index:-1}
#modal .gc{animation:gcIn .7s cubic-bezier(.2,1.35,.4,1) both}
#modal .gc::after{content:"";position:absolute;inset:-3px;border-radius:18px;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.7) 50%,transparent 62%);background-size:260% 100%;background-position:160% 0;animation:gcShine .9s .5s ease-out both;pointer-events:none}
#modal .gc-row .gc-col:nth-child(2) .gc,#modal .gc-row .gc-col:nth-child(2) .gc::after{animation-delay:.12s}
#modal .gc-row .gc-col:nth-child(3) .gc,#modal .gc-row .gc-col:nth-child(3) .gc::after{animation-delay:.24s}
#modal .gc-row .gc-col:nth-child(4) .gc,#modal .gc-row .gc-col:nth-child(4) .gc::after{animation-delay:.36s}
#modal .gc-row .gc-col:nth-child(n+5) .gc,#modal .gc-row .gc-col:nth-child(n+5) .gc::after{animation-delay:.48s}
#modal .gc-row .gc-col .btn{animation:gcFade .4s .45s both}
#modal .gc.ghost{animation:gcIn .7s cubic-bezier(.2,1.35,.4,1) both,gcWobble .45s .7s 2 ease-in-out}
#modal .gc .gc-coin.lg{animation:gcCoin .8s .55s ease-out both}
.gc-wrap.ghost::before{background:repeating-conic-gradient(rgba(155,123,224,.55) 0 9deg,transparent 9deg 22deg)}
@keyframes gcIn{0%{transform:translateY(46px) scale(.45) rotateY(-90deg);opacity:0}45%{opacity:1}65%{transform:translateY(-6px) scale(1.06) rotateY(10deg)}100%{transform:none;opacity:1}}
@keyframes gcShine{to{background-position:-60% 0}}
@keyframes gcBurst{0%{transform:scale(.2) rotate(0);opacity:0}30%{opacity:1}100%{transform:scale(1.1) rotate(50deg);opacity:0}}
@keyframes gcWobble{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes gcCoin{0%{transform:rotateY(0)}100%{transform:rotateY(720deg)}}
@keyframes gcFade{from{opacity:0;transform:translateY(8px)}}
/* dice roll effect */
.dfx{position:fixed;inset:0;z-index:70;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:radial-gradient(circle at 50% 50%,rgba(20,14,40,.6),rgba(20,14,40,.35) 60%,rgba(20,14,40,.15));animation:dfxIn .2s ease-out both}
.dfx.out{animation:dfxOut .25s ease-in forwards}
.dfx-row{display:flex;gap:22px;perspective:700px}
.dfx-throw{position:relative;display:flex;flex-direction:column;align-items:center;animation:dfxThrow 1.05s cubic-bezier(.3,.7,.4,1) both}
.dfx-cube{width:70px;height:70px;position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.15,.75,.25,1)}
.dfx-face{position:absolute;inset:0;background:#FFFDF6;border:3px solid #2A2238;border-radius:14px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;box-sizing:border-box;backface-visibility:hidden;box-shadow:inset 0 -6px 0 rgba(42,34,56,.08)}
.dfx-face i{width:12px;height:12px;border-radius:50%;background:#2A2238;place-self:center;visibility:hidden}
.dfx-face i.on{visibility:visible}
.dfx-face.f1 i.on{width:20px;height:20px}
.dfx-face.f1 i.on,.dfx-face.f4 i.on{background:#E8453C}
.f1{transform:translateZ(35px)}.f6{transform:rotateY(180deg) translateZ(35px)}
.f3{transform:rotateY(90deg) translateZ(35px)}.f4{transform:rotateY(-90deg) translateZ(35px)}
.f5{transform:rotateX(90deg) translateZ(35px)}.f2{transform:rotateX(-90deg) translateZ(35px)}
.dfx-shadow{width:64px;height:12px;margin-top:14px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(3px);animation:dfxShadow 1.05s cubic-bezier(.3,.7,.4,1) both}
.dfx-total{font-family:var(--font-d);font-weight:600;font-size:48px;line-height:1.1;color:#FFD84D;-webkit-text-stroke:7px #2A2238;paint-order:stroke fill;text-shadow:0 5px 0 #2A2238;opacity:0;transform:scale(.4)}
.dfx-total small{display:block;font-size:18px;color:#fff;-webkit-text-stroke:5px #2A2238;text-shadow:0 2px 0 #2A2238;margin-top:6px;text-align:center}
.dfx.landed .dfx-total{animation:dfxPop .45s cubic-bezier(.2,1.6,.4,1) forwards}
.dfx.landed .dfx-throw{animation:dfxLand .3s ease-out}

const mySeat=()=>MODE==="online"&&S?S.players.findIndex(p=>p.uid===ON.me):-1;
const isMyTurn=()=>MODE==="local"||(S&&S.turn===mySeat());
const amHost=()=>MODE==="local"||(S&&S.hostUid===ON.me);
const botNow=()=>!!(S&&S.phase==="play"&&S.players[S.turn]&&S.players[S.turn].bot);
const isBotTurn=()=>botNow()&&amHost();
const assets=i=>S.players[i].money+PROPS.filter(p=>S.owners[p.id]===i).reduce((t,p)=>t+p.price,0);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function log(t){S.log.unshift(t); S.log=S.log.slice(0,8); S.logN=(S.logN||0)+1; sfxLog(t);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function newGame(names,years,map){
  const deck=[]; for(const k in ITEMS) for(let i=0;i<ITEMS[k].count;i++) deck.push(k);
  S={phase:"play",years,year:1,month:0,turn:0,newRail:false,
     players:names.map((n,i)=>({name:n,color:PCOL[i][1],node:"BKK",money:100,cards:[]})),
     owners:{},deck:shuffle(deck),discard:[],ghost:{holder:-1,count:0},skip:names.map(()=>false),
     dest:null,map:map||"all",log:[],logN:0,songkran:false,stage:"begin",turnId:1,rev:0,tf:{nDice:1,cardUsed:false,locked:false},lastMove:null,report:null};
  S.dest=drawDest(true);
  log("เริ่มเกม ทุกคนออกจากกรุงเทพฯ พร้อมเงิน 100 ล้าน");
}
function drawDest(first){
  const taken=new Set(S.players.map(p=>p.node));
  const pool=(S.map==="north"?CLASSIC:Object.keys(NAME)).filter(s=>s!=="DNC"&&s!==S.dest&&!(first&&s==="BKK")&&!taken.has(s));
  return pool[Math.floor(Math.random()*pool.length)];
}
function drawItem(i){
  const p=S.players[i];
  if(p.cards.length>=5) return null;
  if(!S.deck.length){S.deck=shuffle(S.discard);S.discard=[];}
  if(!S.deck.length) return null;
  const c=S.deck.pop(); p.cards.push(c); return c;
}
function discardCard(i,k){const p=S.players[i];const ix=p.cards.indexOf(k);if(ix>=0){p.cards.splice(ix,1);S.discard.push(k);}}

// save (local) or sync (online)
function commit(){
  if(!S) return;
  if(MODE==="local"){
    SAFE=JSON.parse(JSON.stringify(S));
    try{localStorage.setItem("rotfai-save",JSON.stringify(SAFE));}catch(e){}
    return;
  }
  S.rev=(S.rev||0)+1;
  const body={...ON.meta,status:S.phase==="over"?"over":"play",S:JSON.parse(JSON.stringify(S)),rev:S.rev,updated:Date.now()};
  ON.meta.status=body.status;
  const ref=ON.ref;
  ON.writeQ=ON.writeQ.then(()=>ref.set(body)).catch(e=>{
    if(!ON.warned){ON.warned=true; toast(e&&e.code==="invalid_argument"?"บันทึกไม่ได้: บัญชีนี้ยังไม่มีสิทธิ์แก้ไขเกม ให้เจ้าของแชร์แบบ Editor":"การเชื่อมต่อมีปัญหา เกมอาจไม่ซิงก์");}
  });
}

    if(s==="DNC") continue;

const OFF=[[-3.6,-3.6],[3.6,-3.6],[-3.6,3.6],[3.6,3.6]];
function renderTokens(){
  const g=$("toks");
  if(g.querySelectorAll(".tok").length!==S.players.length){
    g.innerHTML=S.players.map((p,i)=>`<g class="tok" id="tok${i}"><circle class="halo" r="3.4" stroke="${p.color}"/><circle class="body" r="3.2" fill="${p.color}" stroke="#fff" stroke-width=".9"/></g>`).join("")
      +`<g id="ghostTok" style="display:none"><path d="M-2.6 2.6V-0.5a2.6 2.6 0 0 1 5.2 0V2.6l-.9-.7-.9.7-.9-.7-.9.7-.9-.7z" fill="#F4F1FA" stroke="#4A3A66" stroke-width=".4"/><circle cx="-.9" cy="-.4" r=".45" fill="#222"/><circle cx=".9" cy="-.4" r=".45" fill="#222"/></g>`;
  }
  const byNode={};
  S.players.forEach((p,i)=>{(byNode[p.node]=byNode[p.node]||[]).push(i);});
  S.players.forEach((p,i)=>{
    const n=NODES[p.node], grp=byNode[p.node], k=grp.length>1?grp.indexOf(i):-1;
    const [ox,oy]=k<0?[0,0]:OFF[k];
    const el=$("tok"+i); el.style.transform=`translate(${n.x+ox}px,${n.y+oy}px)`;
    el.classList.toggle("active",S.phase==="play"&&i===S.turn);
    if(i===S.turn) g.appendChild(el);
  });
  const gt=$("ghostTok");
  if(S.ghost.holder>=0){const p=S.players[S.ghost.holder],n=NODES[p.node];gt.style.display="";gt.setAttribute("transform",`translate(${n.x+6.5},${n.y-6.5}) scale(1.25)`);g.appendChild(gt);}
  else gt.style.display="none";
}
function sizeBoard(){
  const m=$("map"); const base=Math.min(Math.max((m.clientWidth-2)/210,1.7),3.8)*zoom;
  svg.style.width=(210*base)+"px"; svg.style.height=(760*base)+"px"; svg.dataset.scale=base;
}
function focusNode(id,smooth=true){
  const m=$("map"),n=NODES[id],sc=+svg.dataset.scale||2;
  m.scrollTo({top:(n.y-22)*sc-m.clientHeight/2,left:n.x*sc-m.clientWidth/2,behavior:smooth&&!reduced()?"smooth":"auto"});
}
async function animateMove(lm){
  const p=S.players[lm.p], final=p.node;
  for(const n of lm.path.slice(1)){ p.node=n; renderTokens(); focusNode(n,true); sfx("step"); await sleep(190); }
  p.node=final; renderTokens();
}

// ================= MODAL =================
let modalResolve=null;
function modal({eyebrow="",title,html="",buttons=[{label:"ตกลง",value:true,primary:true}]}){
  if(modalResolve){const r=modalResolve;modalResolve=null;r(undefined);}
  $("modal").classList.remove("again");
  return new Promise(res=>{
    modalResolve=res;
    $("modal").innerHTML=`${eyebrow?`<div class="eyebrow">${eyebrow}</div>`:""}<h3>${title}</h3><div class="body">${html}</div>
      ${buttons.length?`<div class="actions">${buttons.map((b,k)=>`<button class="btn ${b.primary?"primary":b.gold?"gold":""}" data-mb="${k}" ${b.disabled?"disabled":""}>${b.label}</button>`).join("")}</div>`:""}`;
    $("modalWrap").hidden=false; if(html.includes('class="gc')) setTimeout(()=>sfx("pop"),60);
    $("modal").querySelectorAll("[data-mb]").forEach(el=>el.onclick=()=>close(buttons[+el.dataset.mb].value));
    $("modal").querySelectorAll("[data-val]").forEach(el=>el.onclick=()=>close(el.dataset.val));
    const f=$("modal").querySelector(".btn.primary,[data-mb]"); if(f) setTimeout(()=>f.focus({preventScroll:true}),30);
    function close(v){$("modalWrap").hidden=true;if(modalResolve===res){modalResolve=null;}res(v);}
  });
}
function closeModal(){ if(modalResolve){const r=modalResolve;modalResolve=null;r(undefined);} $("modalWrap").hidden=true; }
function brief(o,ms=1500){const p=modal({...o,buttons:[]});const r=modalResolve;setTimeout(()=>{if(modalResolve===r) closeModal();},reduced()?400:ms);return p;}
const say=(o,ms)=>isBotTurn()?brief(o,ms):modal(o);
const info=(title,html,eyebrow)=>say({title,html,eyebrow});
function propRow(p,right){const c=TYPE_COL[p.t];return `<div class="prop"><div class="ic" style="background:${c}22">${typeIcon(p.t,c)}</div><div><div class="pn">${p.n}</div><div class="pm">${p.t} · ราคา ${p.price} · กำไร ${p.profit}/ปี</div></div><div>${right}</div></div>`;}
function typeIcon(t,c){const g={[FOOD]:`<path d="M5 13h22a11 10 0 0 1-22 0z" fill="${c}"/><path d="M11 10c-1.5-2 1.5-3.5 0-6M16 10c-1.5-2 1.5-3.5 0-6M21 10c-1.5-2 1.5-3.5 0-6" stroke="${c}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`,[AGRI]:`<path d="M16 29V14" stroke="${c}" stroke-width="2.2" stroke-linecap="round"/><path d="M16 16C8 16 5 10 6 4c7 0 10 4 10 12z" fill="${c}"/><path d="M16 19c7 0 10-5 9-10-6 0-9 4-9 10z" fill="${c}" opacity=".7"/>`,[TOUR]:`<path d="M3 27l10-16 6 9 4-5 7 12z" fill="${c}"/><path d="M13 11V4l6 2.5-6 2.5" fill="${c}" stroke="${c}" stroke-width="1.4"/>`,[IND]:`<path d="M3 28V15l7 5v-5l7 5v-5l7 5V6h4v22z" fill="${c}"/>`}[t];return `<svg width="22" height="22" viewBox="0 0 32 32">${g}</svg>`;}
function ownerTag(o){return o===undefined?"":`<span class="owner-tag"><span class="dot" style="background:${S.players[o].color}"></span>${esc(S.players[o].name)}</span>`;}
function choosePlayer(title,exclude,html=""){
  const btns=S.players.map((p,k)=>({label:esc(p.name),value:k})).filter(b=>b.value!==exclude);

// ================= ACTIONS =================
function canUse(k){
  if(S.tf.locked&&["exp","sexp","home","drive","plane"].includes(k)) return false;
  if(k==="amulet"||k==="insure") return false;
  if(k==="pass") return S.ghost.holder===S.turn;
  if(k==="viral") return PROPS.some(p=>S.owners[p.id]===S.turn);
  if(k==="plane") return S.year>=2;
  return true;
}
async function onCard(){
  if(UI.busy||!isMyTurn()) return;
  const p=cur();
  const uniq=[...new Set(p.cards)];
  const html=`<p class="note" style="margin-top:0">ปัดซ้ายขวาดูการ์ด</p><div class="gc-row">${uniq.map(k=>{const n=p.cards.filter(c=>c===k).length;return `<div class="gc-col">${itemCard(k)}${canUse(k)?`<button class="btn gold" data-val="${k}">ใช้${n>1?` (มี ${n} ใบ)`:""}</button>`:`<div class="pm" style="min-height:40px;display:grid;place-items:center">${k==="amulet"||k==="insure"?"ใช้อัตโนมัติเมื่อถึงเวลา":"ใช้ตอนนี้ไม่ได้"}${n>1?` · มี ${n} ใบ`:""}</div>`}</div>`;}).join("")}</div>`;
  const k=await modal({title:"การ์ดในมือ",html,buttons:[{label:"ปิด",value:null}]});
  if(!k) return;
  UI.busy=true;
  const r=await useCard(k);
  UI.busy=false;
  if(r==="cancel") return render();
  discardCard(S.turn,k); S.tf.cardUsed=true;
  if(r==="moved") return endTurn();
  commit();
  if(typeof r==="number") return goMove(r);
  render();
}
async function teleport(to,arrived){
  const p=cur(); S.lastMove={id:Date.now()+"-"+Math.random().toString(36).slice(2,6),p:S.turn,path:[p.node,to]};
  ON.seenMove=S.lastMove.id; p.node=to; commit(); render(); focusNode(to); await sleep(300);
  await resolveSquare(to,arrived);
}

    case "viral":{ const mine=PROPS.filter(q=>S.owners[q.id]===i);

async function onRoll(){
  if(UI.busy||!isMyTurn()||UI.mode!=="choose") return; UI.busy=true;
  let steps;
  if(S.tf.locked){ steps=1; UI.dice=[]; }
  else{
    const vals=await rollAndShow(S.tf.nDice||1);
    steps=vals.reduce((a,b)=>a+b,0);
    if(S.songkran){steps=Math.max(1,steps-1);}
  }
  UI.busy=false;
  goMove(steps);
}
function endpoints(start,steps){
  const a=adjacency(S.newRail), res=new Map();
  (function dfs(node,prev,path,left){
    if(node===S.dest&&path.length>1){ if(!res.has(node)) res.set(node,path.slice()); return; }
    if(left===0){ if(!res.has(node)) res.set(node,path.slice()); return; }
    let nx=a[node].filter(n=>n!==prev); if(!nx.length) nx=a[node];
    for(const n of nx){path.push(n);dfs(n,node,path,left-1);path.pop();}
  })(start,null,[start],steps);
  return res;
}
function goMove(steps){
  UI.mode="pick"; UI.steps=steps; UI.opts=endpoints(cur().node,steps);
  if(S.songkran&&!S.tf.locked) log("สงกรานต์รถติด แต้มเดิน −1");
  render();
  const first=[...UI.opts.keys()][0]; if(first) focusNode(first);
}
async function onPick(id,fromBot){
  if(botNow()&&!fromBot) return;
  if(UI.mode!=="pick"||UI.busy||!UI.opts||!UI.opts.has(id)) return;
  UI.busy=true; const path=UI.opts.get(id); UI.mode="moving"; UI.msg="กำลังเดินทาง…"; UI.opts=null;
  const i=S.turn,p=cur(); let passed=null;
  if(S.ghost.holder===i){ for(const n of path.slice(1)){ const o=S.players.findIndex((q,k)=>k!==i&&q.node===n); if(o>=0){passed=o;break;} } }
  const start=p.node;
  p.node=id;
  if(passed!==null){ S.ghost={holder:passed,count:0}; log(`ผีกระโดดจาก${p.name}ไปหา${S.players[passed].name}`); }
  S.lastMove={id:Date.now()+"-"+Math.random().toString(36).slice(2,6),p:i,path};
  ON.seenMove=S.lastMove.id;
  commit();
  render();
  p.node=start; renderTokens();
  p.node=id; await animateMove(S.lastMove);
  render();
  if(passed!==null) await info("ผีย้ายบ้าน!",`ระหว่างทางเจอ${esc(S.players[passed].name)} ผีเลยกระโดดไปติดแทน`);
  await resolveSquare(p.node,p.node===S.dest);
  UI.busy=false;
  endTurn();
}
async function pay(i,amt,reason,insurable){
  const p=S.players[i];
  if(insurable&&amt>0&&p.cards.includes("insure")){
    let use=true;
    if(!p.bot&&(MODE==="local"||i===mySeat())){
      use=await modal({eyebrow:esc(p.name),title:`ต้องจ่าย ${amt} ล้าน`,html:`${reason}<p>มีการ์ดประกันภัย ใช้เพื่อไม่ต้องจ่ายไหม</p>`,buttons:[{label:"ใช้ประกันภัย",value:true,gold:true},{label:"จ่ายเอง",value:false}]});
    }
    if(use){discardCard(i,"insure");log(`${p.name} ใช้ประกันภัย ไม่ต้องจ่าย ${amt} ล้าน`);return false;}
  }
  p.money-=amt; return true;
}
async function resolveSquare(id,arrived){
  const i=S.turn,p=cur(),t=NODES[id].t;
  if(arrived){
    const rw=REWARD[id]; p.money+=rw; log(`${p.name} ถึง${NAME[id]}คนแรก รับ ${rw} ล้าน`); commit(); render();
    await say({eyebrow:"ถึงจุดหมาย",title:`${esc(p.name)} ถึง${NAME[id]}คนแรก!`,html:wrapCard(destCard(id))+`<div class="big-num" style="color:#C8361E;text-align:center">+${rw} ล้าน</div>`});
    await buySheet(id);
    await assignGhost(id);
    S.dest=drawDest(false); log(`จุดหมายใหม่: ${NAME[S.dest]} รางวัล ${REWARD[S.dest]} ล้าน`); commit(); render(); focusNode(S.dest);
    await info("จุดหมายใหม่",`ทุกคนมุ่งหน้าไป <b>${NAME[S.dest]}</b> รางวัล ${REWARD[S.dest]} ล้าน`,"จับฉลาก");
    return;
  }
  if(t==="b"){ const d=rnd(6); UI.dice=[d]; p.money+=d*2; log(`${p.name} ได้ ${d*2} ล้านจากช่องน้ำเงิน`); commit(); render(); await info(`ได้เงิน ${d*2} ล้าน`,`ทอยได้ ${d} × 2 ล้าน`,"ช่องน้ำเงิน"); }
  else if(t==="r"){ const d=rnd(6); UI.dice=[d]; render(); if(await pay(i,d*2,`ทอยได้ ${d} × 2 ล้าน`,true)){log(`${p.name} เสีย ${d*2} ล้านที่ช่องแดง`); commit(); render(); await info(`เสียเงิน ${d*2} ล้าน`,`ทอยได้ ${d} × 2 ล้าน`,"ช่องแดง");} }
  else if(t==="y"||t==="jn"){ const c=drawItem(i); commit(); render(); if(c){log(`${p.name} ได้การ์ดไอเทม`); await say({eyebrow:"ได้การ์ดไอเทม",title:ITEMS[c].n,html:(MODE==="online"&&p.bot)?"บอทเก็บการ์ดไว้ในมือ":wrapCard(itemCard(c))});} else await info("มือเต็ม","ถือการ์ดได้สูงสุด 5 ใบ รอบนี้ไม่ได้จั่ว"); }
  else if(t==="st"){
    if(S.quiz&&Math.random()<0.35){
      const r=S.year>=2?12:8;
      const ok=await askQuiz(id,"ควิซประจำสถานี"+NAME[id],`ตอบถูกได้ ${r} ล้าน · ตอบผิดเสีย 2 ล้าน`);
      if(ok){p.money+=r;log(`${p.name} ได้โบนัสควิซ ${r} ล้าน`);} else {p.money-=2;}
      commit(); render();
    }
    await buySheet(id);
  }
}
async function buySheet(s){
  if(isBotTurn()) return botBuy(s);
  const props=PROPS_AT(s); if(!props.length) return;
  if(!props.some(q=>S.owners[q.id]===undefined)) return;
  const i=S.turn,p=cur(); let shown=false;
  while(true){
    const free=props.filter(q=>S.owners[q.id]===undefined);
    if(!free.length) break;
    const html=`<p>เงินคงเหลือ <b>${fmt(p.money)}</b>${props.length>1?" · ปัดซ้ายขวาดูการ์ด":""}</p><div class="gc-row">${props.map(q=>`<div class="gc-col">${propCard(q)}${S.owners[q.id]!==undefined?`<div style="min-height:40px;display:grid;place-items:center">${ownerTag(S.owners[q.id])}</div>`:`<button class="btn primary" data-val="${q.id}" ${p.money<q.price?"disabled":""}>ซื้อ ${q.price} ล้าน</button>`}</div>`).join("")}</div>`;
    const mp=modal({eyebrow:"สถานี"+NAME[s],title:"ซื้อกิจการ",html,buttons:[{label:"เสร็จ",value:"done"}]});
    if(shown) $("modal").classList.add("again"); shown=true;
    const v=await mp;
    if(v==="done"||v===undefined) break;
    const q=PROPS[+v]; if(p.money<q.price) continue;
    p.money-=q.price; S.owners[q.id]=i; log(`${p.name} ซื้อ${q.n} ${q.price} ล้าน`); commit(); render();
  }
}
async function assignGhost(dest){
  const d=bfs(dest,S.newRail); let best=-1,bd=-1;
  S.players.forEach((q,k)=>{ if(k===S.turn) return; const v=d[q.node]??0; if(v>bd||(v===bd&&q.money>S.players[best].money)){bd=v;best=k;} });
  if(best<0) return;
  const was=S.ghost.holder; S.ghost={holder:best,count:was===best?S.ghost.count:0};
  log(`ผีไปติด${S.players[best].name} คนที่อยู่ไกลที่สุด`); commit(); render();
  await info("ผีมาแล้ว",`${esc(S.players[best].name)} อยู่ไกล${NAME[dest]}ที่สุด (${bd} ช่อง) ผีตามไปติดตัว`,"ผีปอบ");
}
async function ghostTurn(){
  const i=S.turn,p=cur(); const giant=S.ghost.count>=3;
  await say({eyebrow:"ผีติดตัว",title:giant?"ผีปอบกลายร่างเป็นร่างยักษ์!":"ผีปอบจะทำอะไรนะ",html:giant?"อยู่ด้วยกันครบ 3 เทิร์น ผีโตขึ้นแล้ว":"ทอยเต๋าดูตารางผี",buttons:[{label:"ทอยตารางผี",value:1,primary:true}]});
  const d=rnd(6);
  S.lastRoll={id:Date.now()+"-g"+Math.random().toString(36).slice(2,5),p:i,vals:[d],kind:"ghost"}; ON.seenRoll=S.lastRoll.id; commit();
  await diceFX([d],`ผีทอยได้ ${d}`,giant?"ตารางร่างยักษ์":"ตารางผี");
  UI.dice=[d]; render();
  const T=giant?[[1,2,"อาละวาด","กิจการทั้งหมดในสถานีที่คุณมีมากที่สุดคืนธนาคารฟรี"],[3,4,"ช้อปหนัก","เสียเงินสดครึ่งหนึ่ง"],[5,5,"ฉีกการ์ด","ทิ้งการ์ดทั้งหมด"],[6,6,"ขายของ","ขายกิจการแพงที่สุดคืนธนาคารครึ่งราคา"]]
              :[[1,1,"ผีปอบสายช้อป","เสียเงิน 5 ล้าน"],[2,2,"ผีปอบสายช้อป","ทิ้งการ์ด 1 ใบแบบสุ่ม"],[3,3,"ผีกระสือเล่นหุ้น","ขายกิจการถูกที่สุดคืนธนาคารครึ่งราคา"],[4,4,"ผีเจ้าที่ขี้งอน","เทิร์นนี้เดินได้ 1 ช่อง ห้ามใช้การ์ดเคลื่อนที่"],[5,5,"ผีหลับ","ไม่มีอะไรเกิดขึ้น"],[6,6,"ผีเลี้ยงหมูกระทะ","จ่ายผู้เล่นคนอื่นคนละ 3 ล้าน"]];
  const row=T.find(r=>d>=r[0]&&d<=r[1]);
  const gid=giant?"G06":({1:"G01",2:"G01",3:"G02",4:"G03",5:"G04",6:"G05"})[d];
  const gface=wrapGhost(ghostCard(gid,giant?"ผีปอบร่างยักษ์":row[2],`ทอยได้ ${d}`,`<div class="gc-line">${row[3]}</div>`));
  if(giant) S.ghost.count=0; else S.ghost.count++;
  const harmless=!giant&&d===5;
  if(!harmless&&S.quiz){
    await say({eyebrow:`ทอยได้ ${d}`,title:"ผีท้าตอบควิซ!",html:`${gface}<p>ตอบควิซถูก ผีจะหนีไปไม่แกล้ง</p>`,buttons:[{label:"รับคำท้า",value:1,primary:true}]},1600);
    const ok=await askQuiz(nearestStation(p.node),"ผีถามควิซ",`ผีจะ: ${row[3]} · ตอบถูกรอดตัว`);
    if(ok){ log(`${p.name} ตอบถูก ผีหนีไปไม่แกล้ง`); render(); return; }
  }
  if(!harmless&&p.cards.includes("amulet")){
    const v=isBotTurn()?(giant||[1,3,6].includes(d)):await modal({eyebrow:`ทอยได้ ${d}`,title:row[2],html:`${gface}<p>มีพระเครื่อง ใช้ยกเลิกผลนี้ไหม</p>`,buttons:[{label:"ใช้พระเครื่อง",value:true,gold:true},{label:"รับผล",value:false}]});
    if(v){discardCard(i,"amulet");log(`${p.name} ใช้พระเครื่องไล่ผี`);render();return;}
  } else await say({eyebrow:`ทอยได้ ${d}`,title:row[2],html:gface},2000);
  const mine=()=>PROPS.filter(q=>S.owners[q.id]===i);
  if(!giant){
    if(d===1){p.money-=5;log(`ผีปอบช้อปด้วยเงิน${p.name} 5 ล้าน`);}
    if(d===2&&p.cards.length){const k=p.cards[Math.floor(Math.random()*p.cards.length)];discardCard(i,k);log(`ผีทิ้งการ์ด${ITEMS[k].n}ของ${p.name}`);}

    if(d===4){S.tf.locked=true;log(`ผีเจ้าที่งอน ${p.name}เดินได้ 1 ช่อง`);}
    if(d===5){log(`ผีของ${p.name}หลับอยู่`);}
    if(d===6){S.players.forEach((q,k)=>{if(k!==i){q.money+=3;p.money-=3;}});log(`${p.name} โดนผีพาเลี้ยงหมูกระทะทุกคน`);}
  } else {
    if(d<=2){const cnt={};mine().forEach(q=>cnt[q.s]=(cnt[q.s]||0)+1);const s=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];if(s){mine().filter(q=>q.s===s).forEach(q=>delete S.owners[q.id]);log(`ผีปอบยักษ์อาละวาดที่${NAME[s]} ${p.name}เสียกิจการทั้งหมดที่นั่น`);}else log(`ผีปอบยักษ์อาละวาด แต่${p.name}ไม่มีกิจการ`);}
    else if(d<=4){if(p.money>0){const l=Math.floor(p.money/2);p.money-=l;log(`ผีปอบยักษ์ช้อปหนัก ${p.name}เสีย ${l} ล้าน`);}}
    else if(d===5){p.cards.forEach(k=>S.discard.push(k));p.cards=[];log(`ผีปอบยักษ์ฉีกการ์ดของ${p.name}ทั้งหมด`);}
    else {const m=mine().sort((a,b)=>b.price-a.price)[0];if(m){delete S.owners[m.id];p.money+=Math.floor(m.price/2);log(`ผีปอบยักษ์ขาย${m.n}ของ${p.name}`);}}
  }
  render();
}
async function settleDebts(){
  for(let i=0;i<S.players.length;i++){
    const p=S.players[i]; const sold=[];
    while(p.money<0){const m=PROPS.filter(q=>S.owners[q.id]===i).sort((a,b)=>a.price-b.price)[0];if(!m)break;delete S.owners[m.id];p.money+=Math.floor(m.price/2);sold.push(m.n);}
    if(sold.length){log(`${p.name} ติดลบ ต้องขาย${sold.join(", ")}`);render();await info("เงินติดลบ!",`${esc(p.name)} ขายกิจการคืนธนาคารครึ่งราคา: ${sold.join(", ")}`);}
  }
}

function pickQuiz(st){
  S.qUsed=S.qUsed||[];
  let pool=QUIZ.map((q,i)=>i).filter(i=>QUIZ[i][0]===st&&!S.qUsed.includes(i));
  if(!pool.length) pool=QUIZ.map((q,i)=>i).filter(i=>!S.qUsed.includes(i));
  if(!pool.length){ S.qUsed=[]; pool=QUIZ.map((q,i)=>i); }
  const i=pool[Math.floor(Math.random()*pool.length)]; S.qUsed.push(i); return i;
}

async function askQuiz(st,eyebrow,stake){

        if(left<=0){ clearInterval(iv); if(modalResolve===r){ timedOut=true; closeModal(); } } },1000); }

const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const FACE_ROT={1:[0,0],2:[90,0],3:[0,-90],4:[0,90],5:[-90,0],6:[0,180]};
async function diceFX(vals,label,sub){
  if(reduced()||document.hidden) return;
  const wrap=document.createElement("div"); wrap.className="dfx"; wrap.setAttribute("aria-hidden","true");
  wrap.innerHTML=`<div class="dfx-row">${vals.map((v,i)=>`<div class="dfx-throw" style="animation-delay:${i*80}ms"><div class="dfx-cube">${[1,2,3,4,5,6].map(f=>`<div class="dfx-face f${f}">${[...Array(9)].map((_,k)=>`<i class="${PIPS[f].includes(k)?"on":""}"></i>`).join("")}</div>`).join("")}</div><div class="dfx-shadow" style="animation-delay:${i*80}ms"></div></div>`).join("")}</div><div style="position:relative"><div class="dfx-burst"></div><div class="dfx-total">${label}${sub?`<small>${sub}</small>`:""}</div></div>`;
  document.body.appendChild(wrap);
  const cubes=[...wrap.querySelectorAll(".dfx-cube")];
  cubes.forEach(c=>{c.style.transition="none";c.style.transform=`rotateX(${Math.random()*360}deg) rotateY(${Math.random()*360}deg)`;});
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  sfx("roll");
  cubes.forEach((c,i)=>{ const [x,y]=FACE_ROT[vals[i]]; const kx=2+Math.floor(Math.random()*2), ky=2+Math.floor(Math.random()*2);
    c.style.transition=""; c.style.transitionDelay=`${i*80}ms`; c.style.transform=`rotateX(${x+360*kx}deg) rotateY(${y+360*ky}deg) rotateZ(${Math.random()<.5?360:-360}deg)`; });
  await sleep(1100+vals.length*80);
  wrap.classList.add("landed"); sfx("land");
  await sleep(850);
  wrap.classList.add("out");
  await sleep(250);
  wrap.remove();
}
function rollLabel(vals){ const s=vals.reduce((a,b)=>a+b,0); return {label:`${s} แต้ม`,sub:S.songkran&&vals.length?"สงกรานต์รถติด −1":""}; }

// ================= BOT =================
function botPickDest(opts){
  if(opts.has(S.dest)) return S.dest;
  const d=bfs(S.dest,S.newRail), i=S.turn, p=cur();
  let best=null,bs=Infinity;
  for(const [id,path] of opts){
    let sc=(d[id]??99)*10; const t=NODES[id].t;
    if(t==="b") sc-=3; if(t==="r") sc+=3; if(t==="y"||t==="jn") sc-=2;
    if(t==="st"&&PROPS_AT(id).some(q=>S.owners[q.id]===undefined&&q.price<=p.money-10)) sc-=4;
    if(S.ghost.holder===i&&path.slice(1).some(n=>S.players.some((q,k)=>k!==i&&q.node===n))) sc-=12;
    sc+=Math.random()*2;
    if(sc<bs){bs=sc;best=id;}
  }
  return best;
}
async function botBuy(s){
  const i=S.turn,p=cur(),props=PROPS_AT(s),bought=[];
  const late=S.month>=9&&S.year>=S.years;
  const reserve=Math.max(10,Math.round(p.money*0.2));
  const free=props.filter(q=>S.owners[q.id]===undefined).sort((a,b)=>b.profit/b.price-a.profit/a.price);
  for(const q of free){
    const completes=props.every(x=>x.id===q.id||S.owners[x.id]===i);
    if(p.money<q.price) continue;
    if(completes||(!late&&p.money-q.price>=reserve)){ p.money-=q.price; S.owners[q.id]=i; bought.push(q); log(`${p.name} ซื้อ${q.n} ${q.price} ล้าน`); }
  }
  if(bought.length){ commit(); render(); await brief({eyebrow:"สถานี"+NAME[s],title:`${esc(p.name)} ซื้อกิจการ`,html:`<div class="gc-row" style="justify-content:${bought.length===1?"center":"flex-start"}">${bought.map(q=>`<div class="gc-col">${propCard(q)}</div>`).join("")}</div>`},1900); }
}
async function botUseCard(){
  const i=S.turn,p=cur(); const has=k=>p.cards.includes(k)&&canUse(k);
  const d=bfs(S.dest,S.newRail), dist=d[p.node]??99;
  let k=null, arg=null;
  if(has("plane")&&dist>6) k="plane";
  else if(has("drive")&&dist>=1&&dist<=6&&endpoints(p.node,dist).has(S.dest)){k="drive";arg=dist;}
  else if(has("pass")){k="pass";arg=S.players.map((q,j)=>({j,m:q.money})).filter(o=>o.j!==i).sort((a,b)=>b.m-a.m)[0].j;}
  else if(has("sexp")&&dist>9) k="sexp";
  else if(has("exp")&&dist>4) k="exp";
  else if(has("viral")) k="viral";
  else if(has("mob")){const near=S.players.map((q,j)=>({j,v:d[q.node]??99})).filter(o=>o.j!==i&&o.v<=6).sort((a,b)=>a.v-b.v)[0]; if(near){k="mob";arg=near.j;}}
  else if(has("lotto")&&p.money>20&&Math.random()<0.3) k="lotto";

  discardCard(i,k); S.tf.cardUsed=true;
  await brief({eyebrow:`${esc(p.name)} ใช้การ์ด`,title:ITEMS[k].n,html:wrapCard(itemCard(k))},1500);
  switch(k){
    case "plane": log(`${p.name} เหมาเครื่องบินไป${NAME[S.dest]}`); await teleport(S.dest,true); return "moved";
    case "drive": log(`${p.name} ขับเอง ${arg} ช่อง`); commit(); return arg;
    case "pass": S.ghost={holder:arg,count:0}; log(`${p.name} ฝากผีให้${S.players[arg].name}`); break;
    case "sexp": S.tf.nDice=3; log(`${p.name} ใช้รถด่วนพิเศษ`); break;
    case "exp": S.tf.nDice=2; log(`${p.name} ใช้รถด่วน`); break;
    case "mob": S.skip[arg]=true; log(`${p.name} ส่งม็อบไปปิดถนน${S.players[arg].name}`); break;
    case "viral":{ const q=PROPS.filter(x=>S.owners[x.id]===i).sort((a,b)=>b.profit-a.profit)[0]; p.money+=q.profit; log(`${q.n}ของ${p.name} ดังในโซเชียล รับ ${q.profit} ล้าน`); break; }
    case "lotto":{ const r=rnd(6); if(r===6){p.money+=30;log(`${p.name} ถูกลอตเตอรี่ รับ 30 ล้าน`);} else {p.money-=1;log(`${p.name} ซื้อลอตเตอรี่ไม่ถูก`);} break; }
  }
  commit(); render(); return null;
}

async function shrinkImage(file){
  const bmp=await createImageBitmap(file); const W=720,H=960;
  const sc=Math.max(W/bmp.width,H/bmp.height), w=bmp.width*sc, h=bmp.height*sc;
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  c.getContext("2d").drawImage(bmp,(W-w)/2,(H-h)/2,w,h);
  return await new Promise(r=>c.toBlob(b=>r(b),"image/webp",0.86));
}
async function manageArt(){
  const [assets,db]=await Promise.all([window.claude?.use?.("assets")??null, window.claude?.use?.("db")??null]);
  const missing=ALL_ART_IDS.filter(id=>!(ART.map[id]&&ART.map[id].url));
  const html=`<p>มีภาพแล้ว <b>${ALL_ART_IDS.length-missing.length}/${ALL_ART_IDS.length}</b> ใบ</p>
    ${assets&&db?`<p>เลือกไฟล์ภาพที่เจนไว้ทีเดียวหลายไฟล์ได้ (เลือกทั้งโฟลเดอร์ rotfai_cards ได้เลย) เกมดูรหัสจากชื่อไฟล์ เช่น card_P01_00001_.png ถ้ามีหลายไฟล์รหัสเดียวกัน ไฟล์ที่เลือกทีหลังจะใช้แทน</p>
    <input class="art-file" type="file" id="artFiles" multiple accept="image/png,image/jpeg,image/webp"><p class="note" id="artProg"></p>`
    :`<p>อัปโหลดได้เฉพาะเจ้าของเกมหรือคนที่ได้สิทธิ์ Can edit ที่ล็อกอินอยู่</p>`}
    ${missing.length?`<p class="note">ยังขาด: ${missing.join(", ")}</p>`:""}`;
  const p=modal({title:"ภาพการ์ด",html,buttons:[{label:"ปิด",value:null,primary:true}]});
  const input=$("artFiles");
  if(input) input.onchange=async()=>{
    const files=[...input.files]; const prog=$("artProg"); const add={}; let ok=0,skip=0,fail=0;
    input.disabled=true;
    for(const f of files){
      const m=f.name.match(/card_([PDIGE]\d{2})/i);
      if(!m||!ALL_ART_IDS.includes(m[1].toUpperCase())){skip++;continue;}
      const id=m[1].toUpperCase();
      if(prog) prog.textContent=`กำลังอัปโหลด ${id} (${ok+fail+1}/${files.length})…`;
      try{ const blob=await shrinkImage(f); const r=await assets.upload(blob); add[id]={id:r.id,url:r.url}; ok++; }
      catch(e){ fail++; }
    }
    if(ok){
      try{ const cur=await db.doc("art/cards").get(); await db.doc("art/cards").set({...(cur.exists?cur.data():{}),...add}); }
      catch(e){ fail+=ok; ok=0; }
    }
    if(prog) prog.textContent=`เสร็จแล้ว: อัปโหลด ${ok} ภาพ${skip?` · ข้าม ${skip} ไฟล์ (ชื่อไม่ตรงรูปแบบ card_XXX)`:""}${fail?` · ไม่สำเร็จ ${fail}`:""}`;
    input.disabled=false; input.value="";
  };
  await p;
}

// เพลงวนแบบไม่มีช่องว่างด้วย Web Audio เริ่มเล่นหลังแตะจอครั้งแรก (เบราว์เซอร์มือถือห้ามเล่นเสียงเอง)
const BGM={ctx:null,gain:null,buf:null,src:null,loading:null,on:true,vol:0.32};

const ICON_ON=`<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 15V4.5l8-1.8V13"/><circle cx="5.8" cy="15" r="2.2"/><circle cx="13.8" cy="13" r="2.2"/></svg>`;
const ICON_OFF=`<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 15V4.5l8-1.8V13" opacity=".45"/><circle cx="5.8" cy="15" r="2.2" opacity=".45"/><circle cx="13.8" cy="13" r="2.2" opacity=".45"/><path d="M3 3l14 14"/></svg>`;
function bgmIcon(){ const b=$("bgmBtn"); if(!b) return; b.innerHTML=BGM.on?ICON_ON:ICON_OFF; b.setAttribute("aria-pressed",String(BGM.on)); b.setAttribute("aria-label",BGM.on?"ปิดเพลง":"เปิดเพลง"); }
function bgmLoad(){
  if(BGM.loading) return BGM.loading;
  BGM.loading=fetch("bgm.mp3").then(r=>{ if(!r.ok) throw 0; return r.arrayBuffer(); })
    .then(a=>new Promise((ok,no)=>BGM.ctx.decodeAudioData(a,ok,no))).then(b=>{BGM.buf=b;return b;})
    .catch(()=>{ BGM.loading=null; return null; });
  return BGM.loading;
}
async function bgmStart(){
  if(!BGM.on||document.hidden) return;
  try{
    if(!actx()) return;
    if(BGM.ctx.state!=="running") await BGM.ctx.resume();
    if(!BGM.src){
      const buf=await bgmLoad(); if(!buf||BGM.src||!BGM.on) return;
      const s=BGM.ctx.createBufferSource(); s.buffer=buf; s.loop=true; s.connect(BGM.gain); s.start(); BGM.src=s;
    }
    const t=BGM.ctx.currentTime; BGM.gain.gain.cancelScheduledValues(t); BGM.gain.gain.setValueAtTime(BGM.gain.gain.value,t); BGM.gain.gain.linearRampToValueAtTime(BGM.vol,t+1.2);
  }catch(e){}
}
function bgmStop(){
  if(!BGM.ctx||!BGM.src) return;
  const t=BGM.ctx.currentTime; BGM.gain.gain.cancelScheduledValues(t); BGM.gain.gain.setValueAtTime(BGM.gain.gain.value,t); BGM.gain.gain.linearRampToValueAtTime(0,t+0.4);
  const s=BGM.src; BGM.src=null; setTimeout(()=>{ try{s.stop();}catch(e){} },450);
}
function bgmToggle(){
  BGM.on=!BGM.on; try{localStorage.setItem("rotfai-bgm",BGM.on?"on":"off");}catch(e){}
  bgmIcon(); if(BGM.on) bgmStart(); else bgmStop();
}

addEventListener("pointerdown",e=>{ if(BGM.on&&!BGM.src&&!(e.target.closest&&e.target.closest("#bgmBtn"))) bgmStart(); else if(SFX.on){ const c=actx(); if(c&&c.state!=="running") c.resume().catch(()=>{}); } },{capture:true,passive:true});

// ================= SFX =================
// เสียงเอฟเฟกต์สังเคราะห์ด้วย Web Audio ทั้งหมด ไม่ต้องโหลดไฟล์
const SFX={on:true,vol:0.5,out:null,last:{}};
try{ SFX.on=localStorage.getItem("rotfai-sfx")!=="off"; }catch(e){}
function actx(){
  if(!BGM.ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; BGM.ctx=new AC(); BGM.gain=BGM.ctx.createGain(); BGM.gain.gain.value=0; BGM.gain.connect(BGM.ctx.destination); }
  if(!SFX.out){ SFX.out=BGM.ctx.createGain(); SFX.out.gain.value=SFX.vol; const comp=BGM.ctx.createDynamicsCompressor(); SFX.out.connect(comp); comp.connect(BGM.ctx.destination); }
  return BGM.ctx;
}
function tn(t0,f,d,{type="sine",v=.3,a=.005,f2=null,dest=null,vib=0}={}){
  const c=BGM.ctx,o=c.createOscillator(),g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+d);
  if(vib){ const l=c.createOscillator(),lg=c.createGain(); l.frequency.value=vib; lg.gain.value=f*.03; l.connect(lg); lg.connect(o.frequency); l.start(t0); l.stop(t0+d+.05); }
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v,t0+a); g.gain.exponentialRampToValueAtTime(.0008,t0+d);
  o.connect(g); g.connect(dest||SFX.out); o.start(t0); o.stop(t0+d+.05);
}
let NOISE=null;
function nz(t0,d,{f=2000,q=1,v=.3,f2=null,type="bandpass"}={}){
  const c=BGM.ctx;
  if(!NOISE){ NOISE=c.createBuffer(1,c.sampleRate,c.sampleRate); const ch=NOISE.getChannelData(0); for(let i=0;i<ch.length;i++) ch[i]=Math.random()*2-1; }
  const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();
  s.buffer=NOISE; fl.type=type; fl.frequency.setValueAtTime(f,t0); if(f2) fl.frequency.exponentialRampToValueAtTime(f2,t0+d); fl.Q.value=q;
  g.gain.setValueAtTime(v,t0); g.gain.exponentialRampToValueAtTime(.0008,t0+d);
  s.connect(fl); fl.connect(g); g.connect(SFX.out); s.start(t0,Math.random()*.5); s.stop(t0+d+.02);
}
const N=m=>440*Math.pow(2,(m-69)/12); // MIDI → Hz
const notes=(t,seq,o={})=>seq.forEach(([m,at,d])=>tn(t+at,N(m),d,o));
const SOUNDS={
  tap:t=>tn(t,700,.05,{type:"triangle",v:.08}),
  pop:t=>{ tn(t,420,.16,{f2:900,v:.22}); tn(t+.06,1300,.12,{v:.06}); },
  roll:t=>{ for(let i=0;i<9;i++){ const at=i*.085+Math.random()*.03; nz(t+at,.05,{f:2200+Math.random()*1800,q:3,v:.7-i*.05}); tn(t+at,180+Math.random()*120,.03,{type:"square",v:.04}); } },
  land:t=>{ tn(t,170,.18,{f2:55,v:.3}); nz(t,.06,{f:900,q:.8,v:.3}); },
  step:t=>{ nz(t,.035,{f:1600,q:2,v:.3}); tn(t,95,.07,{type:"triangle",v:.18}); },
  coin:t=>{ tn(t,N(83),.09,{type:"square",v:.12}); tn(t+.08,N(88),.35,{type:"square",v:.12}); },
  coins:t=>{ for(let i=0;i<6;i++) tn(t+i*.07,N(84+(i%3)*4),.18,{type:"square",v:.08}); tn(t+.45,N(96),.5,{type:"triangle",v:.12}); },
  lose:t=>{ tn(t,N(67),.18,{type:"triangle",v:.25,f2:N(62)}); tn(t+.18,N(60),.4,{type:"triangle",v:.25,f2:N(55)}); },
  buy:t=>{ nz(t,.05,{f:3000,q:2,v:.25}); tn(t+.04,2093,.5,{v:.18}); tn(t+.04,4186,.3,{v:.05}); SOUNDS.coin(t+.18); },
  card:t=>{ nz(t,.28,{f:500,f2:4000,q:1.2,v:.55}); tn(t+.2,N(88),.2,{type:"triangle",v:.08}); },
  use:t=>{ nz(t,.22,{f:3500,f2:600,q:1.2,v:.22}); notes(t+.1,[[79,0,.12],[84,.07,.12],[91,.14,.3]],{type:"triangle",v:.12}); },
  arrive:t=>{ notes(t,[[72,0,.14],[76,.12,.14],[79,.24,.14],[84,.36,.55]],{type:"square",v:.1}); notes(t,[[48,0,.3],[55,.36,.6]],{type:"triangle",v:.18}); SOUNDS.whistle(t+.95); },
  whistle:t=>{ tn(t,N(74),.7,{type:"sine",v:.16,a:.04,vib:6}); tn(t,N(78),.7,{type:"sine",v:.12,a:.04,vib:6}); tn(t,N(81),.7,{type:"triangle",v:.05,a:.04}); },
  dest:t=>{ tn(t,N(76),.35,{type:"sine",v:.14,a:.03,vib:5}); tn(t,N(80),.35,{type:"sine",v:.1,a:.03,vib:5}); tn(t+.4,N(76),.5,{type:"sine",v:.14,a:.03,vib:5}); tn(t+.4,N(80),.5,{type:"sine",v:.1,a:.03,vib:5}); },
  ghost:t=>{ tn(t,420,1.1,{type:"sine",v:.14,f2:190,a:.15,vib:7}); tn(t+.05,630,1,{type:"triangle",v:.06,f2:300,a:.2,vib:5}); nz(t,.9,{f:700,f2:300,q:4,v:.06}); },
  correct:t=>{ tn(t,N(88),.12,{type:"square",v:.11}); tn(t+.1,N(93),.4,{type:"square",v:.11}); tn(t+.1,N(100),.3,{v:.06}); },
  wrong:t=>{ tn(t,150,.16,{type:"sawtooth",v:.2}); tn(t+.2,140,.3,{type:"sawtooth",v:.2}); },
  tick:t=>{ tn(t,1500,.06,{v:.35}); nz(t,.02,{f:4000,q:2,v:.2}); },
  hurry:t=>{ tn(t,2000,.07,{type:"square",v:.2}); tn(t,1000,.07,{v:.25}); },
  event:t=>{ [[79,0],[76,.18],[72,.36]].forEach(([m,at])=>{ tn(t+at,N(m),.9,{v:.11}); tn(t+at,N(m)*2.76,.4,{v:.03}); }); },
  over:t=>{ notes(t,[[67,0,.15],[72,.15,.15],[76,.3,.15],[79,.45,.3],[76,.75,.15],[79,.9,.9]],{type:"square",v:.1}); notes(t,[[48,0,.7],[53,.45,.4],[55,.9,1]],{type:"triangle",v:.16}); SOUNDS.coins(t+1.1); }
};
function sfx(name){
  if(!SFX.on||document.hidden||!SOUNDS[name]) return;
  const c=actx(); if(!c||c.state!=="running") return;
  const now=performance.now(); if(now-(SFX.last[name]||0)<90) return; SFX.last[name]=now;
  try{ SOUNDS[name](c.currentTime+.01); }catch(e){}
}
// เสียงตามบันทึกเหตุการณ์ ใช้ทั้งเครื่องที่เล่นและเครื่องเพื่อน (ออนไลน์) ให้ได้ยินเหมือนกัน
const LOG_SFX=[[/คนแรก/,"arrive"],[/ตอบควิซถูก|ตอบถูก/,"correct"],[/ตอบควิซผิด|ไม่ทัน/,"wrong"],[/^ผี/,"ghost"],[/ไม่ถูก|เสีย|ติดลบ|ค่าซ่อม|จ่าย 2/,"lose"],
  [/ปิดงบปีที่/,"coins"],[/ถูกลอตเตอรี่|โบนัส|ได้ .*ล้าน|ดังในโซเชียล|รับ .*ล้าน/,"coin"],[/ซื้อ/,"buy"],[/ใช้|ขับเอง|เหมาเครื่องบิน|ส่งม็อบ/,"use"],
  [/ผี/,"ghost"],[/ได้การ์ด/,"card"],[/จุดหมายใหม่/,"dest"],[/สงกรานต์|ปีใหม่|ตรุษจีน|ฤดู|ลอยกระทง|น้ำท่วม|ฝุ่น|รางใหม่|เดือนปิดงบ/,"event"]];
let sfxQ=Promise.resolve();
function sfxLog(t){ const m=LOG_SFX.find(([re])=>re.test(t)); if(m) sfxQ=sfxQ.then(()=>{ sfx(m[1]); return new Promise(r=>setTimeout(r,140)); }); }
function sfxToggle(){ SFX.on=!SFX.on; try{localStorage.setItem("rotfai-sfx",SFX.on?"on":"off");}catch(e){} if(SFX.on){ actx(); sfx("coin"); } }
document.addEventListener("click",e=>{ const b=e.target.closest&&e.target.closest("button"); if(b&&!b.disabled&&!b.closest(".dfx")) sfx("tap"); },true);

// ================= BOOT =================
window.claude?.hot?.snapshot?.(()=>({save:MODE==="local"?SAFE:null,room:MODE==="online"&&ON.meta?ON.meta.code:null}));
function start(data){
  buildBoard(); sizeBoard(); initArt();
  if(data&&data.room) return onlineLobby(data.room);
  if(data&&data.save&&data.save.phase==="play"){ MODE="local"; S=data.save; render(); return beginTurn(); }
  home();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
