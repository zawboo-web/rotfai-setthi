<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}html,body{height:100%}</style>
<title>ตุ๊กตุ๊กเศรษฐีไทย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one-screen pass-and-play board — scrollable rail map on top, operator panel below on phones; panel becomes a right column on tablets */
:root{
  --bg:#E7ECE4; --surface:#FFFFFF; --surface-2:#F3F6F1; --ink:#17232B; --muted:#5A6A6E; --line:#CBD4CC;
  --rail:#1F4E9C; --accent:#F2B705; --accent-ink:#2B2100; --bus:#9AA29A; --new:#E2711D;
  --plus:#2F6FDE; --minus:#D94335; --card:#E0A800; --field-n:#DFEBD8; --field-c:#EFEADB; --field-e:#DCEAF0; --sea:#B9DDF2; --hwy:#E3CB93; --field-ne:#F4E4D8; --lbl-ne:#B0705E; --field-s:#DCEFE7; --lbl-s:#3E8C78; --field-w:#E9E3EF; --lbl-e:#4E86A0; --lbl-w:#8670A0;
  --shadow:0 10px 30px rgba(20,35,40,.18);
  --font-d:'Mitr','Sukhumvit Set',Thonburi,'Noto Sans Thai','Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif;
  --font-b:'IBM Plex Sans Thai','Sukhumvit Set',Thonburi,'Noto Sans Thai','Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F171B; --surface:#18232A; --surface-2:#1E2B32; --ink:#E6EDE9; --muted:#97A6A4; --line:#2C3A41;
  --rail:#6F9BEB; --accent:#F2B705; --accent-ink:#2B2100; --bus:#5D6964; --new:#F08A3C;
  --plus:#4F87EB; --minus:#EA6150; --card:#E0A800; --field-n:#15231A; --field-c:#211E16; --field-e:#13222A; --sea:#1C3A52; --hwy:#5E4E2C; --field-ne:#2A1E19; --lbl-ne:#D9A08E; --field-s:#13261F; --lbl-s:#7CC2AE; --field-w:#1F1A26; --lbl-e:#7FB3CC; --lbl-w:#B19BCB;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F171B; --surface:#18232A; --surface-2:#1E2B32; --ink:#E6EDE9; --muted:#97A6A4; --line:#2C3A41;
  --rail:#6F9BEB; --accent:#F2B705; --accent-ink:#2B2100; --bus:#5D6964; --new:#F08A3C;
  --plus:#4F87EB; --minus:#EA6150; --card:#E0A800; --field-n:#15231A; --field-c:#211E16; --field-e:#13222A; --sea:#1C3A52; --hwy:#5E4E2C; --field-ne:#2A1E19; --lbl-ne:#D9A08E; --field-s:#13261F; --lbl-s:#7CC2AE; --field-w:#1F1A26; --lbl-e:#7FB3CC; --lbl-w:#B19BCB;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,[data-node]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}

/* top bar */
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-family:var(--font-d);font-weight:600;font-size:18px;color:var(--rail);margin-right:auto;white-space:nowrap}
@media (max-width:520px){.brand{font-size:0;margin-right:auto}.brand::before{content:"";}.top{flex-wrap:nowrap;gap:6px}.chip{padding:5px 9px;font-size:13px}.chip.dest{min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;display:block}.iconbtn{flex:none;width:36px;height:36px}#netChip{flex:none;padding:5px 8px}#netChip .t{display:none}.chip.dest .lbl,.chip.dest .ml{display:none}.chip.dest::before{content:"⚑ ";color:#C8361E}.chip .yl{display:none}.top>.chip{padding:5px 8px}.iconbtn{width:34px;height:34px}.top{gap:5px}}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13.5px;white-space:nowrap}
.chip b{font-family:var(--font-d);font-weight:500}
.chip.dest{border-color:#C8361E}
.chip.dest b{color:#C8361E}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}

/* stage */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.mapwrap{flex:1;min-height:180px;position:relative}
.map{position:absolute;inset:0;overflow:auto;border-radius:16px;background:var(--field-c);border:1px solid var(--line);overscroll-behavior:contain}
.map svg{display:block;margin:0 auto}
.zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:20px;font-weight:600;box-shadow:var(--shadow)}
.panel{flex:none;max-height:48%;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:2px}
@media (min-width:860px){
  .stage{flex-direction:row}
  .panel{width:370px;max-height:none}
}

/* board svg */
.stn-ring{fill:var(--surface);stroke:var(--ink);stroke-width:1.3}
.stn-num{font-family:var(--font-d);font-weight:600;font-size:5px;fill:var(--rail)}
.stn-name{font-family:var(--font-d);font-weight:500;font-size:6px;fill:var(--ink)}
.hwy{stroke:var(--hwy);stroke-width:4.6;stroke-linecap:round}.rail{stroke:var(--rail);stroke-width:1.5;stroke-dasharray:1.6 .7}
.bus{stroke:var(--bus);stroke-width:1.5;stroke-dasharray:2.2 1.2;stroke-linecap:round}
.road{stroke:#C9A15A;stroke-width:1.9;stroke-linecap:round;opacity:.9}
.sea{stroke:#3E9BE0;stroke-width:1.6;stroke-dasharray:2.4 1.6;stroke-linecap:round}
.fut{stroke:var(--new);stroke-width:2.3;stroke-dasharray:3 2;opacity:.75}
svg.newrail .fut{stroke-dasharray:none;opacity:1}
svg.newrail .barrier{display:none}
.reach{fill:var(--accent);fill-opacity:.25;stroke:var(--accent);stroke-width:1.4;cursor:pointer;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{fill-opacity:.55}}
.tok{transition:transform .17s ease-out}
.gtok{transition:transform .9s cubic-bezier(.4,1.4,.5,1);cursor:pointer}
.gfloat{animation:gfl 2.4s ease-in-out infinite}@keyframes gfl{50%{transform:translateY(-.8px)}}
.curse-card{border:2px solid #8E5BC9;background:#F3ECFC;color:#2A2238;border-radius:14px;padding:14px;text-align:center;margin:4px 0 10px}.cc-name{font-family:var(--font-d);font-size:22px;font-weight:600;color:#5B2E9A}.cc-eff{font-size:15px;margin-top:4px}.cc-note{font-size:12.5px;color:#6B5E7A;margin-top:8px}
.tok.active circle.body{stroke-width:1.4}
.tok .halo{fill:none;stroke-width:1;opacity:.0}
.tok.active .halo{opacity:.9;animation:halo 1.2s ease-out infinite}
@keyframes halo{0%{r:3.4;opacity:.9}100%{r:7;opacity:0}}
.destflag{pointer-events:none}
.stn-hit{fill:transparent;cursor:pointer}

/* panel */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.who{display:flex;align-items:center;gap:10px}
.who .tokbig{width:34px;height:34px;flex:none}
.who .nm{font-family:var(--font-d);font-weight:500;font-size:17px;line-height:1.2}
.who .sub{font-size:13px;color:var(--muted)}
.money{margin-left:auto;text-align:right}
.money b{font-family:var(--font-d);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.money small{display:block;font-size:12px;color:var(--muted)}
.neg{color:var(--minus)}
.prompt{margin-top:8px;font-size:14px;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{min-height:48px;padding:0 16px;border-radius:12px;font-family:var(--font-d);font-weight:500;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1;background:var(--surface-2);border:1px solid var(--line)}
.btn.primary{background:var(--rail);border-color:var(--rail);color:#fff}
.btn.gold{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.shop-row b{display:flex!important;width:100%;justify-content:space-between;gap:8px}.shop-pr{color:#B07A00;white-space:nowrap}.shop-row.sell .shop-pr{color:#2E9A4E}
.tre-mark{animation:treTw 2.4s ease-in-out infinite;transform-box:fill-box}@keyframes treTw{50%{opacity:.55}}.mini.tre{background:#FFF1C9;color:#7A5300;border-color:#E6C46A}
.btn.travel{border-color:#3E9BE0;color:#2F6FDE;background:var(--surface);flex:1}.travel-row{display:flex;gap:8px;flex-basis:100%;order:-1}
.btn:disabled{opacity:.45;cursor:not-allowed}
.dice{display:flex;gap:8px;justify-content:center;margin-top:10px}
.die{width:46px;height:46px;border-radius:11px;background:var(--surface);border:2px solid var(--ink);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:6px}
.die i{width:8px;height:8px;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pick{min-height:42px;padding:0 12px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-family:var(--font-d);font-weight:500}
.pick small{font-family:var(--font-b);font-weight:400;opacity:.8;margin-left:4px}
.hand{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mini{font-size:12.5px;background:#FFF3C4;color:#4A3A00;border-radius:7px;padding:2px 8px}
.ghostb{font-size:12.5px;background:#EDE5F7;color:#4A2F78;border-radius:7px;padding:2px 8px}
.label{font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:600}
.board-list{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.prow{display:grid;grid-template-columns:14px 1fr auto auto;gap:8px;align-items:center;padding:7px 6px;border-radius:10px;text-align:left;width:100%}
.prow:hover{background:var(--surface-2)}
.prow.cur{background:var(--surface-2)}
.dot{width:12px;height:12px;border-radius:50%}
.prow .n{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .v{font-variant-numeric:tabular-nums;font-size:14px;text-align:right}
.prow .a{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);text-align:right;min-width:62px}
.log{display:flex;flex-direction:column;gap:3px;margin-top:6px;font-size:13px}
.log div{color:var(--muted)}
.log div:first-child{color:var(--ink)}

/* modal */
[hidden]{display:none!important}
.mg-how{font-size:16px;line-height:1.5;background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:6px}
.mg-wrap{position:fixed;inset:0;z-index:70;background:rgba(10,18,22,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px;animation:mgIn .25s ease-out both;touch-action:none;user-select:none;-webkit-user-select:none}
.mg-wrap.done{animation:mgOut .45s ease-in both}@keyframes mgIn{from{opacity:0;transform:scale(.96)}}@keyframes mgOut{to{opacity:0}}
.mg-top{width:min(420px,100%);display:flex;align-items:center;gap:10px;color:#fff;font-size:15px}.mg-top b{flex:1;font-family:var(--font-d);font-size:18px}
.mg-score{font-family:var(--font-d);font-size:22px;background:#FFC21A;color:#2A2238;border-radius:10px;padding:2px 12px;min-width:64px;text-align:center}.mg-time{font-family:var(--font-d);font-size:20px;min-width:52px;text-align:right}
.mg-arena{position:relative;width:min(420px,100%);height:min(420px,62vh);background:var(--surface);border-radius:20px;border:3px solid #2A2238;overflow:hidden;display:grid;place-items:center}
.mg-mortar{background:none;border:0;padding:0;touch-action:manipulation}
.mg-somtam{display:block;place-items:initial;cursor:pointer}.st-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.st-stage{position:absolute;left:50%;bottom:6%;width:64%;aspect-ratio:1;transform:translateX(-50%);pointer-events:none}
.st-mortar{position:absolute;left:0;bottom:0;width:100%;transform-origin:50% 100%;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25))}
.st-mortar.squash{animation:stSquash .14s ease-out}@keyframes stSquash{40%{transform:scale(1.04,.95)}}
.st-pestle{position:absolute;left:50%;bottom:52%;width:22%;transform:translateX(-30%) rotate(14deg);transform-origin:50% 100%;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
.st-pestle.down{animation:stPound .14s ease-in}@keyframes stPound{45%{transform:translateX(-30%) translateY(26%) rotate(6deg)}}
.st-fx{position:absolute;left:50%;top:22%;width:0;height:0}.st-fx i{position:absolute;border-radius:3px;animation:stFly .55s ease-out forwards}
@keyframes stFly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.st-bar{position:absolute;left:8%;right:8%;top:5%;height:12px;border-radius:99px;background:rgba(255,255,255,.75);border:2px solid #2A2238;overflow:hidden}.st-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7BC043,#F6D27A,#E8453C);transition:width .1s}
.st-goal .st-bar{box-shadow:0 0 0 3px #FFC21A}.mg-mortar .mg-pestle{transform-origin:60px 60px;transition:transform .06s}.mg-mortar.hit .mg-pestle{animation:mgPound .12s}
@keyframes mgPound{50%{transform:translateY(14px)}}
.mg-teashop{display:block;place-items:initial;cursor:pointer}
.tc-stage{position:absolute;top:0;bottom:0;left:50%;aspect-ratio:1;transform:translateX(-50%);pointer-events:none}
.tc-cup{position:absolute;left:30.65%;top:28%;height:54%;filter:drop-shadow(0 8px 8px rgba(0,0,0,.3))}
.tc-liq,.tc-mark{position:absolute;left:30.65%;width:38.7%;top:36.1%;height:43.2%}
.tc-liq{clip-path:polygon(8.5% 0,91.5% 0,75% 100%,25% 100%);mix-blend-mode:multiply;opacity:.92}
.tc-liq i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#F9B26E,#E0782A 30%,#C9611C);box-shadow:inset 0 3px 0 rgba(255,240,210,.8)}
.tc-mark .mg-line{left:2%;right:2%}
.tc-mark .mg-line::after{content:"";position:absolute;right:-12px;top:-6px;border:7px solid transparent;border-right-color:#E8453C}
.tc-pot{position:absolute;inset:0;transform-origin:45% 4%;transition:transform .2s}.tc-pot.pour{transform:rotate(-4deg)}
.tc-filter,.tc-idle{position:absolute;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.tc-filter{left:38.3%;top:1%;height:62%;opacity:0;clip-path:inset(0 0 60% 0);transition:clip-path .15s linear}
.tc-idle{left:38.98%;top:4.51%;width:35.8%}
.tc-pot.pour .tc-filter{opacity:1;clip-path:inset(0 0 0 0)}.tc-pot.pour .tc-idle{opacity:0}
.tc-hint{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);padding:8px 18px;border-radius:99px;background:#2A2238;color:#fff;font-weight:700;font-size:15px;white-space:nowrap;pointer-events:none;transition:transform .1s}
.tc-hint.on{transform:translateX(-50%) scale(.94);background:#E0782A}
.tc-ok .tc-cup{animation:stSquash .3s}.tc-spill .tc-liq i{background:linear-gradient(#E8453C,#C9611C)}
.mg-tea{display:flex;flex-direction:column;align-items:center;gap:16px}.mg-glass{position:relative;width:110px;height:220px;border:4px solid #2A2238;border-top:0;border-radius:0 0 22px 22px;background:#EAF6FF;overflow:hidden}
.mg-tea-fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#F7A35C,#E0782A)}.mg-line{position:absolute;left:-4px;right:-4px;height:3px;background:#E8453C;box-shadow:0 0 0 1px #fff}
.mg-hold{min-width:180px;min-height:56px;font-size:17px;touch-action:none}.mg-hold.on{transform:scale(.96);filter:brightness(1.1)}
.mg-art{display:block;place-items:initial}
.mg-mosq{position:absolute;width:30%;height:auto;margin:-10% 0 0 -15%;font-size:0;background:none;border:0;padding:0;touch-action:none;animation:mgFly .9s ease-in-out infinite alternate}
.mg-mosq img{width:100%;transform:scaleX(var(--fx,1));filter:drop-shadow(0 4px 4px rgba(0,0,0,.35));pointer-events:none}
@keyframes mgFly{to{transform:translate(var(--dx),var(--dy))}}.mg-mosq.hit{animation:mgSquash .4s ease-out forwards}@keyframes mgSquash{30%{transform:scale(1.15)}to{opacity:0;transform:scale(.9) translateY(10px)}}
.spl-stage{pointer-events:auto}.spl-win{position:absolute;width:14%;aspect-ratio:1;transform:translate(-50%,-50%)}
.spl-face{position:absolute;inset:0;padding:0;border:0;background:none;touch-action:none;animation:mgPop .15s ease-out both}.spl-face img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));pointer-events:none}
.spl-face.wet img{filter:brightness(1.1) saturate(.8) drop-shadow(0 0 6px #6EC6FF)}.spl-drop{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;animation:mgPop .2s ease-out both}
.mg-room{background:linear-gradient(#FFF6E3,#F3E3C2)}.mg-mosq{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;font-size:34px;background:none;border:0;animation:mgBuzz .25s ease-in-out infinite alternate;touch-action:none}
@keyframes mgBuzz{to{transform:translate(4px,-3px) rotate(8deg)}}
.mg-house{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:88%;height:88%}.mg-win{background:#7EC8E3;border:4px solid #8B5A2B;border-radius:10px;display:grid;place-items:center;overflow:hidden}
.mg-face{width:100%;height:100%;font-size:40px;background:none;border:0;animation:mgPop .15s ease-out both;touch-action:none}.mg-face.gran{background:#FFE3EC}@keyframes mgPop{from{transform:translateY(60%)}}
.mg-result{font-size:18px;font-weight:600;text-align:center;padding:10px;border-radius:12px}.mg-result.win{background:#E5F4E4;color:#1F6B33}.mg-result.lose{background:#FBEBEB;color:#9B2C22}
.money b,.money small{white-space:nowrap}
.modal-wrap{position:fixed;inset:0;background:rgba(10,18,22,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (min-width:600px){.modal-wrap{align-items:center}}
.modal{background:var(--surface);color:var(--ink);border-radius:20px;box-shadow:var(--shadow);width:100%;max-width:460px;max-height:86%;overflow:auto;padding:18px 18px 16px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:0}}
.modal h3{font-family:var(--font-d);font-weight:600;font-size:21px;line-height:1.25;text-wrap:balance}
.modal .eyebrow{font-size:12px;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:2px}
.modal .body{margin-top:8px;font-size:15px}
.modal .body p+p{margin-top:6px}
.modal .actions{margin-top:16px}
.big-num{font-family:var(--font-d);font-weight:600;font-size:34px;line-height:1.1}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.prop{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.prop .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.prop .pn{font-weight:600;font-size:14.5px;line-height:1.25}
.prop .pm{font-size:12.5px;color:var(--muted)}
.prop .btn{flex:none;min-height:40px;font-size:14px;padding:0 12px}
.owner-tag{font-size:12.5px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.seg{display:flex;gap:6px;margin-top:6px}
.seg button{flex:1;min-height:44px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--font-d)}
.seg button[aria-pressed="true"]{background:var(--rail);border-color:var(--rail);color:#fff}
.field{margin-top:12px}

/* game cards (fixed look in both themes, like printed cards) */
.gc{--c:#FF8A3D;--cl:#FFE3CC;--cl2:#FFD3B0;width:260px;height:363px;box-sizing:border-box;background:var(--c);border:3px solid #2A2238;border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 #2A2238;color:#2A2238;font-family:'Mali',var(--font-b);flex:none;text-align:left}
.gc-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.gc-pill{background:#fff;border:2px solid #2A2238;border-radius:999px;padding:1px 10px;font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-dark{background:#2A2238;color:#fff;border-radius:999px;padding:2px 9px;font-weight:700;font-size:11px;white-space:nowrap}
.gc-art{height:178px;border:3px solid #2A2238;border-radius:13px;overflow:hidden;background:repeating-linear-gradient(135deg,var(--cl) 0 12px,var(--cl2) 12px 24px);display:grid;place-items:center;flex:none}
.gc-art.short{height:150px}
.gc-art img{width:100%;height:100%;object-fit:cover;display:block}
.gc-ph{background:rgba(255,255,255,.85);border:2px dashed #2A2238;border-radius:8px;padding:2px 8px;font-size:11px;font-weight:600}
.gc-name{margin-top:-22px;align-self:center;position:relative;background:#fff;border:3px solid #2A2238;border-radius:12px;padding:1px 14px;font-family:var(--font-d);font-weight:600;font-size:18px;line-height:1.3;box-shadow:0 3px 0 #2A2238;max-width:94%;text-align:center}
.gc-name.big{font-size:24px}
.gc-name.dark{background:#2A2238;color:#fff;box-shadow:0 3px 0 #EDE5FF}
.gc-panel{flex:1;background:#fff;border:2px solid #2A2238;border-radius:13px;padding:7px 10px;display:flex;flex-direction:column;justify-content:center;gap:5px;font-size:13.5px;font-weight:700;line-height:1.35;min-height:0;overflow:hidden}
.gc-panel.center{align-items:center;text-align:center}
.gc-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gc-stat{background:#fff;border:2px solid #2A2238;border-radius:12px;padding:3px 6px;display:flex;align-items:center;gap:6px;line-height:1.15}
.gc-coin{width:30px;height:30px;flex:none;border-radius:50%;background:#FFD84D;border:2px solid #2A2238;display:grid;place-items:center;font-family:var(--font-d);font-weight:600;font-size:13px}
.gc-coin.lg{width:54px;height:54px;font-size:21px;box-shadow:inset 0 0 0 3px #FFEFA3}
.gc-stat small,.gc-sub{display:block;font-size:10.5px;color:#6B5E7A;font-weight:700}
.gc-stat b{font-size:12px}
.gc-foot{margin-top:auto;text-align:center;font-size:10.5px;font-weight:700;display:flex;justify-content:center;align-items:center;gap:4px}
.gc-dot{width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #2A2238}
.gc-num{display:inline-grid;place-items:center;flex:none;min-width:22px;height:22px;border-radius:999px;background:#EDE5FF;border:2px solid #2A2238;font-size:12px;padding:0 4px;margin-right:6px}
.gc-line{display:flex;align-items:center}
.gc-wrap{display:flex;justify-content:center;margin:4px 0 10px}
.gc-row{display:flex;gap:12px;overflow-x:auto;padding:4px 4px 10px;scroll-snap-type:x mandatory;margin:8px -4px 0}
.gc-col{display:flex;flex-direction:column;gap:8px;align-items:center;scroll-snap-align:center;flex:none}
.gc-col .btn{width:100%;flex:none}
.art-file{display:block;width:100%;margin-top:10px;font:inherit}
/* card pop-up effects */
.gc-wrap,.gc-row{perspective:900px}
.gc{position:relative;transform-origin:50% 60%}
.gc-wrap{position:relative;isolation:isolate}
.gc-wrap::before{content:"";position:absolute;left:50%;top:50%;width:440px;height:440px;margin:-220px 0 0 -220px;border-radius:50%;background:repeating-conic-gradient(rgba(255,216,77,.6) 0 9deg,transparent 9deg 22deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 25%,transparent 68%);animation:gcBurst 1.5s ease-out both;pointer-events:none;z-index:-1}
#modal .gc{animation:gcIn .7s cubic-bezier(.2,1.35,.4,1) both}
#modal .gc::after{content:"";position:absolute;inset:-3px;border-radius:18px;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.7) 50%,transparent 62%);background-size:260% 100%;background-position:160% 0;animation:gcShine .9s .5s ease-out both;pointer-events:none}
#modal .gc-row .gc-col:nth-child(2) .gc,#modal .gc-row .gc-col:nth-child(2) .gc::after{animation-delay:.12s}
#modal .gc-row .gc-col:nth-child(3) .gc,#modal .gc-row .gc-col:nth-child(3) .gc::after{animation-delay:.24s}
#modal .gc-row .gc-col:nth-child(4) .gc,#modal .gc-row .gc-col:nth-child(4) .gc::after{animation-delay:.36s}
#modal .gc-row .gc-col:nth-child(n+5) .gc,#modal .gc-row .gc-col:nth-child(n+5) .gc::after{animation-delay:.48s}
#modal .gc-row .gc-col .btn{animation:gcFade .4s .45s both}
#modal .gc.ghost{animation:gcIn .7s cubic-bezier(.2,1.35,.4,1) both,gcWobble .45s .7s 2 ease-in-out}
#modal .gc .gc-coin.lg{animation:gcCoin .8s .55s ease-out both}
.gc-wrap.ghost::before{background:repeating-conic-gradient(rgba(155,123,224,.55) 0 9deg,transparent 9deg 22deg)}
@keyframes gcIn{0%{transform:translateY(46px) scale(.45) rotateY(-90deg);opacity:0}45%{opacity:1}65%{transform:translateY(-6px) scale(1.06) rotateY(10deg)}100%{transform:none;opacity:1}}
@keyframes gcShine{to{background-position:-60% 0}}
@keyframes gcBurst{0%{transform:scale(.2) rotate(0);opacity:0}30%{opacity:1}100%{transform:scale(1.1) rotate(50deg);opacity:0}}
@keyframes gcWobble{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes gcCoin{0%{transform:rotateY(0)}100%{transform:rotateY(720deg)}}
@keyframes gcFade{from{opacity:0;transform:translateY(8px)}}
/* dice roll effect */
.dfx{position:fixed;inset:0;z-index:70;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:radial-gradient(circle at 50% 50%,rgba(20,14,40,.6),rgba(20,14,40,.35) 60%,rgba(20,14,40,.15));animation:dfxIn .2s ease-out both}
.dfx.out{animation:dfxOut .25s ease-in forwards}
.dfx-row{display:flex;gap:22px;perspective:700px}
.dfx-throw{position:relative;display:flex;flex-direction:column;align-items:center;animation:dfxThrow 1.05s cubic-bezier(.3,.7,.4,1) both}
.dfx-cube{width:70px;height:70px;position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.15,.75,.25,1)}
.dfx-face{position:absolute;inset:0;background:#FFFDF6;border:3px solid #2A2238;border-radius:14px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;box-sizing:border-box;backface-visibility:hidden;box-shadow:inset 0 -6px 0 rgba(42,34,56,.08)}
.dfx-face i{width:12px;height:12px;border-radius:50%;background:#2A2238;place-self:center;visibility:hidden}
.dfx-face i.on{visibility:visible}
.dfx-face.f1 i.on{width:20px;height:20px}
.dfx-face.f1 i.on,.dfx-face.f4 i.on{background:#E8453C}
.f1{transform:translateZ(35px)}.f6{transform:rotateY(180deg) translateZ(35px)}
.f3{transform:rotateY(90deg) translateZ(35px)}.f4{transform:rotateY(-90deg) translateZ(35px)}
.f5{transform:rotateX(90deg) translateZ(35px)}.f2{transform:rotateX(-90deg) translateZ(35px)}
.dfx-shadow{width:64px;height:12px;margin-top:14px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(3px);animation:dfxShadow 1.05s cubic-bezier(.3,.7,.4,1) both}
.dfx-total{font-family:var(--font-d);font-weight:600;font-size:48px;line-height:1.1;color:#FFD84D;-webkit-text-stroke:7px #2A2238;paint-order:stroke fill;text-shadow:0 5px 0 #2A2238;opacity:0;transform:scale(.4)}
.dfx-total small{display:block;font-size:18px;color:#fff;-webkit-text-stroke:5px #2A2238;text-shadow:0 2px 0 #2A2238;margin-top:6px;text-align:center}
.dfx.landed .dfx-total{animation:dfxPop .45s cubic-bezier(.2,1.6,.4,1) forwards}
.dfx.landed .dfx-throw{animation:dfxLand .3s ease-out}
.dfx-burst{position:absolute;left:50%;top:50%;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;background:repeating-conic-gradient(rgba(255,216,77,.55) 0 8deg,transparent 8deg 20deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 65%);mask:radial-gradient(circle,#000 20%,transparent 65%);opacity:0;z-index:-1}
.dfx.landed .dfx-burst{animation:gcBurst 1s ease-out both}
@keyframes dfxIn{from{opacity:0}}
@keyframes dfxOut{to{opacity:0}}
@keyframes dfxThrow{0%{transform:translateY(300px) scale(.5)}45%{transform:translateY(-90px) scale(1.15)}70%{transform:translateY(0) scale(1)}82%{transform:translateY(-22px)}100%{transform:translateY(0)}}
@keyframes dfxShadow{0%{transform:scale(.3);opacity:0}45%{transform:scale(.5);opacity:.4}70%{transform:scale(1);opacity:1}82%{transform:scale(.8)}100%{transform:scale(1)}}
@keyframes dfxLand{50%{transform:scale(1.12,.9)}}
@keyframes dfxPop{to{opacity:1;transform:scale(1)}}

.qtimer{display:flex;align-items:center;gap:10px;margin:8px 0 10px}
.qtrack{flex:1;height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.qbar{height:100%;background:var(--accent);transform-origin:left;animation:qbar linear forwards}
.qtimer b{font-family:var(--font-d);font-size:20px;min-width:28px;text-align:right;font-variant-numeric:tabular-nums}

@keyframes qbar{from{transform:scaleX(1)}to{transform:scaleX(0);background:var(--minus)}}
#modal.again .gc,#modal.again .gc::after,#modal.again .gc-col .btn{animation:none}
#modal.again{animation:none}

.mode-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);min-height:64px}
.mode-btn b{font-family:var(--font-d);font-weight:500;font-size:17px}
.mode-btn span{font-size:13px;color:var(--muted)}

.stack{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.code{font-family:var(--font-d);font-weight:600;font-size:30px;letter-spacing:.18em;color:var(--rail)}
.room{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.room .rn{font-family:var(--font-d);font-weight:500;letter-spacing:.1em}
.room .rm{font-size:12.5px;color:var(--muted)}
.seat{display:grid;grid-template-columns:16px 1fr;gap:10px;align-items:center;padding:6px 0}
.seat>div{min-width:0}
.seat input{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:0 10px;font:inherit;width:100%;min-width:0;box-sizing:border-box}
.seat .who-n{font-size:12.5px;color:var(--muted)}
.you{font-size:11.5px;background:var(--rail);color:#fff;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.note{font-size:13px;color:var(--muted);margin-top:10px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));z-index:40;display:flex;flex-direction:column;gap:6px;width:min(420px,calc(100% - 32px));pointer-events:none}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

<script>
'use strict';
// ================= I18N =================
// ภาษาของเครื่องนี้ (แต่ละคนในห้องออนไลน์เลือกภาษาของตัวเองได้)
let LANG="th"; try{ const l=localStorage.getItem("rotfai-lang"); if(l==="en"||l==="ja") LANG=l; }catch(e){}
const LANGS=[["th","ไทย"],["en","English"],["ja","日本語"]];
const LI=()=>LANG==="en"?0:1;
// ข้อความแปล: ภาษาไทยคือคีย์ → [อังกฤษ, ญี่ปุ่น]  ตัวแปรเขียนในวงเล็บปีกกา เช่น {p}
const TR={};
function money(n){ n=Number(n); const a=Math.abs(n).toLocaleString(LANG==="ja"?"ja-JP":LANG==="en"?"en-US":"th-TH"), s=n<0?"−":"";
  return LANG==="en"?`${s}฿${a}M`:LANG==="ja"?`${s}${a}百万`:`${s}${a} ล้าน`; }
function stN(id){ if(!NAME[id]) return id; return LANG==="th"?NAME[id]:STN_TR[id][LI()]; }
function propN(p){ if(typeof p==="number") p=PROPS[p]; return LANG==="th"?p.n:PROP_TR[p.id][LI()]; }
function itemF(k,f){ const v=ITEMS[k][f]; return LANG==="th"?v:(ITEM_TR[k][f]||[v,v])[LI()]; }
const itemN=k=>itemF(k,"n");
const treN=k=>T(TREASURES[k].n), treF=k=>T(TREASURES[k].eff);
function typeN(t){ return LANG==="th"?t:({"อาหาร":["Food","グルメ"],"เกษตร":["Farm","農業"],"ท่องเที่ยว":["Tourism","観光"],"อุตสาหกรรม":["Industry","工業"]}[t]||[t,t])[LI()]; }
function monthN(m){ return LANG==="th"?MONTHS[m]:(LANG==="en"?["Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec","Jan","Feb","Mar"]:["4月","5月","6月","7月","8月","9月","10月","11月","12月","1月","2月","3月"])[m]; }
function colorN(k){ return LANG==="th"?PCOL[k][0]:[["Red","赤"],["Blue","青"],["Green","緑"],["Yellow","黄"]][k][LI()]; }
function defaultCo(k){ return LANG==="th"?"ตุ๊กตุ๊ก"+PCOL[k][0]:LANG==="en"?colorN(k)+" Tuk-Tuk":colorN(k)+"トゥクトゥク"; }
// แทนค่าตัวแปร: st=สถานี, pr=กิจการ, it=ไอเทม, m=เงิน, mo=เดือน, prs=รายการกิจการ, sts=รายการสถานี
function fillVars(s,a){ return s.replace(/\{(\w+)\}/g,(_,k)=>{ const v=a?a[k]:undefined; if(v===undefined) return "";
  const b=k.replace(/\d+$/,"");
  if(b==="st") return stN(v); if(b==="pr") return propN(v); if(b==="it") return itemN(v);
  if(b==="m") return money(v); if(b==="mo") return monthN(v);
  if(b==="prs") return v.map(propN).join(", "); if(b==="sts") return v.map(stN).join(", ");
  if(b==="t") return T(v); return v; }); }
const TH_AT={"@off":"ปิด","@lobbyhint":"บอกรหัสนี้ให้เพื่อน แล้วให้เพื่อนเปิดลิงก์เดียวกัน กด \"เล่นออนไลน์\" และเลือกห้องนี้"};
function T(s,a){ if(LANG!=="th"){ const e=TR[s]; if(e) s=e[LI()]; } else if(s[0]==="@") s=TH_AT[s]||s; return fillVars(s,a); }
const logText=e=>typeof e==="string"?e:T(e[0],e[1]);
function setLang(l){
  LANG=l; try{localStorage.setItem("rotfai-lang",l);}catch(e){}
  applyStaticLang();
  try{ buildBoard(); sizeBoard(); if(S) render(); }catch(e){}
}
function applyStaticLang(){
  document.documentElement.lang=LANG; document.title=T("ตุ๊กตุ๊กเศรษฐีไทย");
  const br=document.querySelector(".brand"); if(br) br.textContent=T("ตุ๊กตุ๊กเศรษฐีไทย");
  $("menuBtn").setAttribute("aria-label",T("เมนู")); $("zin").setAttribute("aria-label",T("ซูมเข้า")); $("zout").setAttribute("aria-label",T("ซูมออก"));
  try{ bgmIcon(); }catch(e){}
}
const langSeg=()=>`<div class="seg langseg" role="group" aria-label="Language">${LANGS.map(([k,n])=>`<button data-val="lang_${k}" aria-pressed="${LANG===k}">${n}</button>`).join("")}</div>`;

function adjacency(newRail,sea,railOnly){
  const a={}; for(const k in NODES) a[k]=[];
  for(const [x,y,k] of EDGES){ if(k==="future"&&!newRail) continue; if(k==="sea"&&!sea) continue; if(railOnly&&k!=="rail"&&k!=="future") continue; a[x].push(y); a[y].push(x); }
  return a;
}
function bfs(from,newRail){
  const a=adjacency(newRail,true), d={[from]:0}, q=[from];
  while(q.length){ const u=q.shift(); for(const v of a[u]) if(d[v]===undefined){d[v]=d[u]+1;q.push(v);} }
  return d;
}

function newGame(names,years,map){
  const deck=[]; for(const k in ITEMS) for(let i=0;i<ITEMS[k].count;i++) deck.push(k);
  S={phase:"play",years,year:1,month:0,turn:0,newRail:false,
     players:names.map((n,i)=>({name:n,color:PCOL[i][1],node:"BKK",money:100,cards:[]})),
     owners:{},deck:shuffle(deck),discard:[],ghosts:[],skip:names.map(()=>false),
     dest:null,map:map||"all",log:[],logN:0,songkran:false,stage:"begin",turnId:1,rev:0,tf:{nDice:1,cardUsed:false,locked:false},lastMove:null,report:null};
  S.dest=drawDest(true);
  log("เริ่มเกม ทุกคนออกจาก{st}พร้อมเงิน {m}",{st:"BKK",m:100});
}
function drawDest(first){
  const taken=new Set(S.players.map(p=>p.node));
  const pool=(S.map==="north"?CLASSIC:Object.keys(NAME)).filter(s=>s!=="DNC"&&s!==S.dest&&!(first&&s==="BKK")&&!taken.has(s));
  return pool[Math.floor(Math.random()*pool.length)];
}
function drawItem(i){
  const p=S.players[i];
  if(p.cards.length>=5) return null;
  if(!S.deck.length){S.deck=shuffle(S.discard);S.discard=[];}
  if(!S.deck.length) return null;
  const c=S.deck.pop(); p.cards.push(c); return c;
}
function takeOut(i,k){const c=S.players[i].cards,ix=c.indexOf(k);if(ix>=0)c.splice(ix,1);}
function discardCard(i,k){const p=S.players[i];const ix=p.cards.indexOf(k);if(ix>=0){p.cards.splice(ix,1);S.discard.push(k);}}

// save (local) or sync (online)
function commit(){
  if(!S) return;
  if(MODE==="local"){
    SAFE=JSON.parse(JSON.stringify(S));
    try{localStorage.setItem("rotfai-save",JSON.stringify(SAFE));}catch(e){}
    return;
  }
  S.rev=(S.rev||0)+1;
  const body={...ON.meta,status:S.phase==="over"?"over":"play",S:JSON.parse(JSON.stringify(S)),rev:S.rev,updated:Date.now()};
  ON.meta.status=body.status;
  const ref=ON.ref;
  ON.writeQ=ON.writeQ.then(()=>ref.set(body)).catch(e=>{
    if(!ON.warned){ON.warned=true; toast(T(e&&e.code==="invalid_argument"?"บันทึกไม่ได้: บัญชีนี้ยังไม่มีสิทธิ์แก้ไขเกม ให้เจ้าของแชร์แบบ Editor":"การเชื่อมต่อมีปัญหา เกมอาจไม่ซิงก์"));}

}

function renderBoard(){
  svg.classList.toggle("newrail",!!S.newRail);

  for(const s in NAME){
    if(s==="DNC") continue;
    const n=NODES[s], props=PROPS_AT(s), r=LABEL_R.has(s);
    const ud=LABEL_UP.has(s)?n.y+9.2:LABEL_DN.has(s)?n.y+16.5:0;
    props.forEach((p,i)=>{
      const o=S.owners[p.id], x=ud?n.x-(props.length-1)*1.7+i*3.4:r?n.x+10.5+i*3.4:n.x-10.5-(props.length-1-i)*3.4;
      h+=`<circle cx="${x}" cy="${ud||n.y+5.4}" r="1.25" fill="${o===undefined?"var(--bg)":S.players[o].color}" stroke="${o===undefined?"var(--muted)":"none"}" stroke-width=".4"/>`;

const OFF=[[-3.6,-3.6],[3.6,-3.6],[-3.6,3.6],[3.6,3.6]];
function renderTokens(){
  const g=$("toks");
  if(g.querySelectorAll(".tok").length!==S.players.length){
    g.innerHTML=S.players.map((p,i)=>`<g class="tok" id="tok${i}"><circle class="halo" r="3.4" stroke="${p.color}"/><circle class="body" r="3.2" fill="${p.color}" stroke="#fff" stroke-width=".9"/></g>`).join("")
      +`<g id="ghostTok" style="display:none"><path d="M-2.6 2.6V-0.5a2.6 2.6 0 0 1 5.2 0V2.6l-.9-.7-.9.7-.9-.7-.9.7-.9-.7z" fill="#F4F1FA" stroke="#4A3A66" stroke-width=".4"/><circle cx="-.9" cy="-.4" r=".45" fill="#222"/><circle cx=".9" cy="-.4" r=".45" fill="#222"/></g>`;
  }
  const byNode={};
  S.players.forEach((p,i)=>{(byNode[p.node]=byNode[p.node]||[]).push(i);});
  S.players.forEach((p,i)=>{
    const n=NODES[p.node], grp=byNode[p.node], k=grp.length>1?grp.indexOf(i):-1;
    const [ox,oy]=k<0?[0,0]:OFF[k];
    const el=$("tok"+i); el.style.transform=`translate(${n.x+ox}px,${n.y+oy}px)`;
    el.classList.toggle("active",S.phase==="play"&&i===S.turn);
    if(i===S.turn) g.appendChild(el);
  });
  renderGhosts();
}
const GHOST_PATH="M-2.8 3V-.4a2.8 2.8 0 0 1 5.6 0V3l-.93-.75-.93.75-.94-.75-.93.75-.94-.75z";
function renderGhosts(){
  let lay=$("ghosts"); if(!lay){ lay=document.createElementNS("http://www.w3.org/2000/svg","g"); lay.id="ghosts"; $("toks").before(lay); }
  const list=S.ghosts||[], seen=new Set();
  list.forEach(gh=>{
    seen.add(gh.id);
    let el=lay.querySelector(`[data-ghost="${gh.id}"]`);
    const G=GHOSTS[gh.k], col=gh.hidden?"#7A6A92":G.col, ring=gh.hidden?"#B9A6D6":G.kind==="bad"?"#D94335":G.kind==="good"?"#2E9A4E":"#E3A900";
    const sig=`${gh.k}|${gh.hidden}`;
    if(!el||el.dataset.sig!==sig){
      if(el) el.remove();
      el=document.createElementNS("http://www.w3.org/2000/svg","g"); el.setAttribute("class","gtok"); el.dataset.ghost=gh.id; el.dataset.sig=sig;
      el.innerHTML=`<circle r="5.2" fill="var(--surface)" stroke="${ring}" stroke-width="1"/><g class="gfloat"><path d="${GHOST_PATH}" fill="${col}" stroke="#2A2238" stroke-width=".35"/><circle cx="-1" cy="-.5" r=".5" fill="#fff"/><circle cx="1" cy="-.5" r=".5" fill="#fff"/>${gh.hidden?`<text y="2.3" text-anchor="middle" font-size="3" font-weight="700" fill="#fff">?</text>`:""}</g><circle r="6.5" fill="transparent"/>`;
      lay.appendChild(el);
    }
    const n=NODES[gh.node], onP=S.players.some(q=>q.node===gh.node);
    el.style.transform=`translate(${n.x+(onP?5.5:0)}px,${n.y-(onP?5.5:0)}px)`;
  });
  lay.querySelectorAll(".gtok").forEach(el=>{ if(!seen.has(el.dataset.ghost)) el.remove(); });
}

  svg.style.width=(400*base)+"px"; svg.style.height=(1050*base)+"px"; svg.dataset.scale=base;

function focusNode(id,smooth=true){
  const m=$("map"),n=NODES[id],sc=+svg.dataset.scale||2;
  m.scrollTo({top:(n.y-22)*sc-m.clientHeight/2,left:n.x*sc-m.clientWidth/2,behavior:smooth&&!reduced()?"smooth":"auto"});

async function animateMove(lm){
  const p=S.players[lm.p], final=p.node;
  for(const n of lm.path.slice(1)){ p.node=n; renderTokens(); focusNode(n,true); sfx("step"); await sleep(190); }
  p.node=final; renderTokens();

let modalResolve=null;
function modal({eyebrow="",title,html="",buttons=[{label:T("ตกลง"),value:true,primary:true}]}){
  if(modalResolve){const r=modalResolve;modalResolve=null;r(undefined);}
  $("modal").classList.remove("again");
  return new Promise(res=>{
    modalResolve=res;
    $("modal").innerHTML=`${eyebrow?`<div class="eyebrow">${eyebrow}</div>`:""}<h3>${title}</h3><div class="body">${html}</div>
      ${buttons.length?`<div class="actions">${buttons.map((b,k)=>`<button class="btn ${b.primary?"primary":b.gold?"gold":""}" data-mb="${k}" ${b.disabled?"disabled":""}>${b.label}</button>`).join("")}</div>`:""}`;
    $("modalWrap").hidden=false; if(html.includes('class="gc')) setTimeout(()=>sfx("pop"),60);
    $("modal").querySelectorAll("[data-mb]").forEach(el=>el.onclick=()=>close(buttons[+el.dataset.mb].value));
    $("modal").querySelectorAll("[data-val]").forEach(el=>el.onclick=()=>close(el.dataset.val));
    const f=$("modal").querySelector(".btn.primary,[data-mb]"); if(f) setTimeout(()=>f.focus({preventScroll:true}),30);
    function close(v){$("modalWrap").hidden=true;if(modalResolve===res){modalResolve=null;}res(v);}
  });
}
function closeModal(){ if(modalResolve){const r=modalResolve;modalResolve=null;r(undefined);} $("modalWrap").hidden=true; }
function brief(o,ms=1500){const p=modal({...o,buttons:[]});const r=modalResolve;setTimeout(()=>{if(modalResolve===r) closeModal();},reduced()?400:ms);return p;}

// ================= ACTIONS =================
function canUse(k){
  if(S.tf.locked&&["exp","sexp","hsr","home","drive","plane","swap"].includes(k)) return false;
  if(k==="amulet"||k==="insure") return false;
  if(hasCurse(S.turn,"nocard")) return false;
  if(k==="pass") return !!curseOf(S.turn);
  if(k==="viral") return PROPS.some(p=>S.owners[p.id]===S.turn);
  if(k==="plane") return S.year>=2;
  if(k==="steal") return S.players.some((q,j)=>j!==S.turn&&q.cards.length);
  if(k==="takeover") return takeoverList().length>0;
  if(["exp","sexp","hsr","drive"].includes(k)&&ISLANDS.has(cur().node)) return false;
  if(TRAIN_CARDS.includes(k)&&!onRail(cur().node)) return false;
  return true;
}
async function onCard(){
  if(UI.busy||!isMyTurn()) return;
  const p=cur();
  const uniq=[...new Set(p.cards)];
  const html=`<p class="note" style="margin-top:0">${T("ปัดซ้ายขวาดูการ์ด")}</p><div class="gc-row">${uniq.map(k=>{const n=p.cards.filter(c=>c===k).length;return `<div class="gc-col">${itemCard(k)}${canUse(k)?`<button class="btn gold" data-val="${k}">${T("ใช้")}${n>1?` ${T("(มี {n} ใบ)",{n})}`:""}</button>`:`<div class="pm" style="min-height:40px;display:grid;place-items:center">${T(k==="amulet"||k==="insure"?"ใช้อัตโนมัติเมื่อถึงเวลา":"ใช้ตอนนี้ไม่ได้")}${n>1?` · ${T("(มี {n} ใบ)",{n})}`:""}</div>`}</div>`;}).join("")}</div>`;
  const k=await modal({title:T("การ์ดในมือ"),html,buttons:[{label:T("ปิด"),value:null}]});
  if(!k) return;
  UI.busy=true;
  const r=await useCard(k);
  UI.busy=false;
  if(r==="cancel") return render();
  discardCard(S.turn,k); S.tf.cardUsed=true;
  if(r==="moved") return endTurn();
  commit();
  if(typeof r==="number") return goMove(r);
  render();
}
async function teleport(to,arrived){
  const p=cur(); S.lastMove={id:Date.now()+"-"+Math.random().toString(36).slice(2,6),p:S.turn,path:[p.node,to]};
  ON.seenMove=S.lastMove.id; p.node=to; commit(); render(); focusNode(to); await sleep(300);
  await resolveSquare(to,arrived);
}
const BAD_GHOSTS=()=>Object.keys(GHOSTS).filter(g=>GHOSTS[g].kind==="bad");
function richestOther(i){ let b=-1,ba=-1e9; S.players.forEach((q,j)=>{ if(j===i) return; const a=assets(j); if(a>ba){ba=a;b=j;} }); return b; }
function takeoverList(){ const i=S.turn,p=cur(); return PROPS.filter(q=>S.owners[q.id]!==undefined&&S.owners[q.id]!==i&&p.money>=q.price*2); }
// ผลการ์ดลูกเล่น ใช้ร่วมกันทั้งคนและบอท · คืน "moved" ถ้าย้ายตำแหน่ง
async function doTrick(k,arg){
  const i=S.turn,p=cur(),secret=MODE==="online"||p.bot;
  switch(k){
    case "steal":{ const q=S.players[arg]; if(!q.cards.length) return; const c=q.cards.splice(Math.floor(Math.random()*q.cards.length),1)[0];
      if(p.cards.length<5) p.cards.push(c); else S.discard.push(c);
      log("{p} ขโมยการ์ดจาก{q} 1 ใบ",{p:p.name,q:q.name}); commit(); render();
      if(!p.bot&&(MODE==="local"||i===mySeat())) await say({eyebrow:T("ขโมยสำเร็จ!"),title:itemN(c),html:wrapCard(itemCard(c))+(p.cards.length>=5&&!p.cards.includes(c)?`<p>${T("มือเต็ม การ์ดใบนี้ถูกทิ้งไป")}</p>`:"")});
      return; }
    case "hex":{ const q=S.players[arg], g=BAD_GHOSTS()[Math.floor(Math.random()*BAD_GHOSTS().length)];
      S.ghosts=(S.ghosts||[]).filter(x=>x.node!==q.node);
      S.ghosts.push({id:"g"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),k:g,node:q.node,hidden:false});
      log("{p} เสก{t}ไปดักรอ{q}",{p:p.name,t:GHOSTS[g].n,q:q.name}); commit(); render(); return; }
    case "tax":{ const j=richestOther(i); if(j<0) return; const q=S.players[j], t=Math.max(0,Math.round(q.money*0.15));
      q.money-=t; log("สรรพากรเก็บภาษี{q} {m}",{q:q.name,m:t}); commit(); render();
      await say({eyebrow:itemN("tax"),title:T("{q} ต้องจ่ายภาษี",{q:esc(q.name)}),html:`<div class="big-num" style="text-align:center;color:#C8361E">−${money(t)}</div>`},1600); return; }
    case "swap":{ const q=S.players[arg], mine=p.node, theirs=q.node; q.node=mine; log("{p} แลกที่นั่งกับ{q}",{p:p.name,q:q.name});
      await teleport(theirs,theirs===S.dest); return "moved"; }
    case "loan": p.money+=30; p.loan=(p.loan||0)+36; log("{p} กู้เงินด่วน {m}",{p:p.name,m:30}); commit(); render(); return;
    case "conv":{ const a=drawItem(i), b=drawItem(i); log("{p} แวะร้านสะดวกซื้อ ได้การ์ด {n} ใบ",{p:p.name,n:(a?1:0)+(b?1:0)}); commit(); render();
      if(!secret&&(a||b)) await say({eyebrow:itemN("conv"),title:T("ได้การ์ดใหม่"),html:`<div class="gc-row">${[a,b].filter(Boolean).map(c=>`<div class="gc-col">${itemCard(c)}</div>`).join("")}</div>`}); return; }
    case "bargain": S.tf.disc=true; log("{p} เตรียมต่อราคา เทิร์นนี้ซื้อกิจการครึ่งราคา",{p:p.name}); commit(); render(); return;
    case "takeover":{ const q=PROPS[arg], o=S.owners[q.id], pr=q.price*2; p.money-=pr; S.players[o].money+=pr; S.owners[q.id]=i;
      log("{p} เทคโอเวอร์{pr}จาก{q} จ่าย {m}",{p:p.name,pr:q.id,q:S.players[o].name,m:pr}); commit(); render();
      await say({eyebrow:itemN("takeover"),title:T("{p} เทคโอเวอร์สำเร็จ",{p:esc(p.name)}),html:wrapCard(propCard(q))},1800); return; }
  }

async function botTravel(){

  const to=(FERRY[p.node]||[]).slice().sort((a,b)=>(d[a]??99)-(d[b]??99))[0];

    await takeBoat(to); return true;
  }
  if(AIRPORTS.includes(p.node)&&p.flew!==S.dest){
    let best=null,bd=here;
    for(const a of AIRPORTS){ if(a===p.node) continue; const v=d[a]??99, f=flyFare(p.node,a); if(v+10<=bd&&p.money>=f+25&&f<=REWARD[S.dest]+5){bd=v;best=a;} }

  }
  return false;
}

const onRail=node=>adjacency(S.newRail,false,true)[node].length>0;
const TRAIN_CARDS=["exp","sexp","hsr"];
function endpoints(start,steps,railOnly){
  const a=adjacency(S.newRail,false,railOnly), res=new Map();
  (function dfs(node,prev,path,left){
    if(left===0){ if(!res.has(node)) res.set(node,path.slice()); return; }
    let nx=a[node].filter(n=>n!==prev); if(!nx.length) nx=a[node];
    for(const n of nx){path.push(n);dfs(n,node,path,left-1);path.pop();}
  })(start,null,[start],steps);
  // เข้าจุดหมายได้เฉพาะเมื่อแต้มเท่ากับระยะทางสั้นที่สุดพอดี (อ้อมวง/เด้งกลับมาลงไม่นับ)
  if(S.dest&&res.has(S.dest)){ const d={[start]:0}, q=[start]; while(q.length){ const u=q.shift(); for(const v of a[u]) if(d[v]===undefined){d[v]=d[u]+1;q.push(v);} } if(d[S.dest]!==steps) res.delete(S.dest); }
  return res;
}
function goMove(steps){
  UI.mode="pick"; UI.steps=steps; UI.opts=endpoints(cur().node,steps,S.tf.rail);
  if(!UI.opts.size){ UI.mode="idle"; return endTurn(); }
  if(S.songkran&&!S.tf.locked) log("สงกรานต์รถติด แต้มเดิน −1",{});
  render();
  const first=[...UI.opts.keys()][0]; if(first) focusNode(first);

  takhon:{n:"ผีตาโขน",kind:"good",walk:true,eff:"ชวนเข้างานบุญ ได้การ์ดไอเทม 2 ใบ",art:"G10",col:"#2F7FC1"},
  krahang:{n:"ผีกระหัง",kind:"wild",walk:true,eff:"พาบินไปลงจังหวัดสุ่ม",art:"G11",col:"#6B5FA8"}
};
const curseOf=i=>S.players[i]&&S.players[i].curse||null;
const hasCurse=(i,k)=>{const c=curseOf(i);return !!(c&&c.k===k);};
const priceOf=(q,i)=>{ let v=hasCurse(i,"pricey")?Math.ceil(q.price*1.5):q.price; if(hasTre(i,"celadon")) v=Math.ceil(v*0.9); if(S.tf&&S.tf.disc&&i===S.turn) v=Math.ceil(v/2); return v; };
function applyCurse(i,k,turns){ S.players[i].curse={k,left:turns}; }
async function curseFarthest(dest){
  const d=bfs(dest,S.newRail); let best=-1,bd=-1;
  S.players.forEach((q,k)=>{ if(k===S.turn) return; const v=d[q.node]??0; if(v>bd||(v===bd&&best>=0&&q.money>S.players[best].money)){bd=v;best=k;} });
  if(best<0) return;
  const q=S.players[best];
  if(q.cards.includes("amulet")){ discardCard(best,"amulet"); log("{p} ใช้เครื่องรางกันคำสาป",{p:q.name}); commit(); render(); await info(T("เครื่องรางคุ้มครอง!"),T("{p} อยู่ไกล{st}ที่สุด แต่เครื่องรางกันคำสาปไว้ได้",{p:esc(q.name),st:dest})); return; }
  const k=CURSE_POOL[Math.floor(Math.random()*CURSE_POOL.length)];
  applyCurse(best,k,3);
  log("{p} อยู่ไกลสุด โดนสาป: {t}",{p:q.name,t:CURSES[k].n}); commit(); render();
  await say({eyebrow:T("คำสาป"),title:T("{p} โดนสาป!",{p:esc(q.name)}),html:curseHTML(k,T("อยู่ไกล{st}ที่สุด ({n} ช่อง)",{st:dest,n:bd}))});
}
function curseHTML(k,why){ return `<div class="curse-card"><div class="cc-name">${T(CURSES[k].n)}</div><div class="cc-eff">${T(CURSES[k].eff)}</div><div class="cc-note">${why?why+" · ":""}${T("3 เทิร์น · แก้ได้ที่จังหวัดที่มีวัด")}</div></div>`; }
async function curseTick(i){
  const c=curseOf(i); if(!c) return;
  c.left--; if(c.left<=0){ S.players[i].curse=null; log("{p} หายจากคำสาปแล้ว",{p:S.players[i].name}); }
}
async function templeCheck(i,node){
  const p=S.players[i], c=curseOf(i);
  if(!c||!TEMPLES.has(node)) return;
  let ok;
  if(p.bot) ok=p.money>=TEMPLE_FEE+5;
  else ok=await modal({eyebrow:T("วัดประจำ{st}",{st:node}),title:T("ทำบุญแก้คำสาป?"),html:curseHTML(c.k)+`<p>${T("จ่าย {m} เพื่อแก้คำสาป{t}",{m:TEMPLE_FEE,t:CURSES[c.k].n})}</p>`,buttons:[{label:T("ไม่เป็นไร"),value:false},{label:T("ทำบุญ {m}",{m:TEMPLE_FEE}),value:true,primary:true,disabled:p.money<TEMPLE_FEE}]});
  if(!ok) return;
  p.money-=TEMPLE_FEE; p.curse=null; log("{p} ทำบุญแก้คำสาปที่{st}",{p:p.name,st:node}); commit(); render();
  if(p.bot) await brief({eyebrow:T("วัดประจำ{st}",{st:node}),title:T("{p} ทำบุญแก้คำสาป",{p:esc(p.name)}),html:""},1400);
}
// ----- ผีบนแผนที่ -----
function ghostSquares(){ return Object.keys(NODES).filter(id=>["b","r","y","g"].includes(NODES[id].t)); }
function spawnGhosts(n){
  S.ghosts=S.ghosts||[];
  const busy=new Set([...S.players.map(p=>p.node),...S.ghosts.map(g=>g.node)]);
  const pool=ghostSquares().filter(id=>!busy.has(id)&&!(NODES[id].t==="g"&&Math.random()<.5));
  const kinds=Object.keys(GHOSTS); let made=0;
  for(let k=0;k<n&&pool.length&&S.ghosts.length<4;k++){
    const node=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    const kind=kinds[Math.floor(Math.random()*kinds.length)];
    S.ghosts.push({id:"g"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),k:kind,node,hidden:Math.random()<.3});
    made++;
  }
  return made;
}
function walkGhosts(){
  const a=adjacency(S.newRail); let moved=0;
  (S.ghosts||[]).forEach(g=>{
    if(!GHOSTS[g.k].walk) return;
    let node=g.node, prev=null; const steps=rnd(6);
    for(let k=0;k<steps;k++){ let nx=a[node].filter(n=>n!==prev); if(!nx.length) nx=a[node]; prev=node; node=nx[Math.floor(Math.random()*nx.length)]; }
    if(NAME[node]){ const sq=a[node].filter(n=>!NAME[n]); if(sq.length) node=sq[Math.floor(Math.random()*sq.length)]; }
    if(node!==g.node){ g.node=node; moved++; }
  });
}
const ghostAt=node=>(S.ghosts||[]).find(g=>g.node===node);
function firstGhostOn(path){ for(const n of path.slice(1)){ const g=ghostAt(n); if(g) return g; } return null; }
function ghostLabel(g){ return g.hidden?T("ผีลึกลับ"):T(GHOSTS[g.k].n); }
function ghostFace(g,sub){
  const G=GHOSTS[g.k];
  return wrapGhost(ghostCard(G.art,T(G.n),T(G.kind==="bad"?"ผีร้าย":G.kind==="good"?"ผีใจดี":"ผีเอาแน่ไม่ได้"),`<div class="gc-line">${T(G.eff)}</div>${sub?`<div class="gc-line" style="font-weight:600">${sub}</div>`:""}`));
}
// เจอผี: คืนค่า "moved" ถ้าถูกพาไปที่อื่น
async function meetGhost(g){
  const i=S.turn,p=cur(),G=GHOSTS[g.k];
  S.ghosts=S.ghosts.filter(x=>x.id!==g.id); commit(); render();
  const face=ghostFace(g);
  if(G.kind==="bad"&&hasTre(i,"durian")){
    log("{t}ได้กลิ่นทุเรียนของ{p} หนีไปแล้ว",{t:G.n,p:p.name}); render();
    await say({eyebrow:T("เจอ{g}!",{g:T(G.n)}),title:T("ผีหนีกลิ่นทุเรียน!"),html:`${face}<p>${T("ทุเรียนหลงลับแลกลิ่นแรงจนผีไม่กล้าเข้าใกล้")}</p>`},1800);
    return;
  }
  if(G.kind==="bad"){
    if(S.quiz){
      await say({eyebrow:T("เจอ{g}!",{g:T(G.n)}),title:T("ผีท้าประลอง!"),html:`${face}<p>${T("ชนะคำท้า ผีจะหนีไปไม่แกล้ง")}</p>`,buttons:[{label:T("รับคำท้า"),value:1,primary:true}]},1600);
      const ok=await challenge(nearestStation(p.node),T("ผีท้าประลอง"),T("ผีจะ: {x} · ชนะรอดตัว",{x:T(G.eff)}));
      if(ok){ log("{p} ชนะคำท้า {t}หนีไปแล้ว",{p:p.name,t:G.n}); render(); return; }
    }
    if(p.cards.includes("amulet")){
      const v=isBotTurn()?true:await modal({eyebrow:T("เจอ{g}!",{g:T(G.n)}),title:T(G.n),html:`${face}<p>${T("มีเครื่องราง ใช้ไล่ผีตัวนี้ไหม")}</p>`,buttons:[{label:T("ใช้เครื่องราง"),value:true,gold:true},{label:T("รับผล"),value:false}]});
      if(v){ discardCard(i,"amulet"); log("{p} ใช้เครื่องรางไล่{t}",{p:p.name,t:G.n}); render(); return; }
    } else if(!S.quiz) await say({eyebrow:T("เจอ{g}!",{g:T(G.n)}),title:T(G.n),html:face},2000);
  } else await say({eyebrow:T("เจอ{g}!",{g:T(G.n)}),title:T(G.n),html:face},2000);
  switch(g.k){
    case "pop": p.money-=5; log("{t}ขโมยเงิน{p} {m}",{t:G.n,p:p.name,m:5}); break;
    case "krasue": if(p.cards.length){ const k=p.cards[Math.floor(Math.random()*p.cards.length)]; discardCard(i,k); log("{t}ขโมยการ์ด{it}ของ{p}",{t:G.n,it:k,p:p.name}); } else log("{t}หาการ์ดของ{p}ไม่เจอ",{t:G.n,p:p.name}); break;
    case "chaoti":{ const k=CURSE_POOL[Math.floor(Math.random()*CURSE_POOL.length)]; applyCurse(i,k,3); log("{p} โดนสาป: {t2}",{p:p.name,t2:CURSES[k].n}); commit(); render(); await say({eyebrow:T(G.n),title:T("{p} โดนสาป!",{p:esc(p.name)}),html:curseHTML(k)}); break; }
    case "kongkoi": applyCurse(i,"slow",1); log("{t}พา{p}หลงป่า",{t:G.n,p:p.name}); break;
    case "takhian":{ if(p.cards.length<5){ p.cards.push("lotto"); } p.lucky=true; log("{t}ใบ้หวยให้{p}",{t:G.n,p:p.name}); break; }
    case "kuman":{ const n=PROPS.filter(q=>S.owners[q.id]===i).length, m=Math.max(5,n*3); p.money+=m; log("{t}เรียกทรัพย์ให้{p} {m}",{t:G.n,p:p.name,m}); break; }
    case "takhon":{ const a=drawItem(i), b=drawItem(i); log("{p} ได้การ์ดจากงานบุญ {n} ใบ",{p:p.name,n:(a?1:0)+(b?1:0)}); break; }
    case "krahang":{ const st=Object.keys(NAME).filter(x=>x!==p.node); const to=st[Math.floor(Math.random()*st.length)]; log("{t}พา{p}บินไป{st}",{t:G.n,p:p.name,st:to}); commit(); render(); await teleport(to,to===S.dest); return "moved"; }
  }
  commit(); render();
}
function showGhost(id){
  if(modalResolve) return; const g=(S.ghosts||[]).find(x=>x.id===id); if(!g) return;
  if(g.hidden) return info(T("ผีลึกลับ"),T("ไม่รู้ว่าเป็นผีอะไร อาจดีหรือร้ายก็ได้ เจอแล้วถึงจะรู้"));
  return modal({eyebrow:T(GHOSTS[g.k].walk?"ผีเดินได้":"ผีอยู่กับที่"),title:T(GHOSTS[g.k].n),html:ghostFace(g)});
}
async function settleDebts(){
  for(let i=0;i<S.players.length;i++){
    const p=S.players[i]; const sold=[];
    while(p.money<0){const m=PROPS.filter(q=>S.owners[q.id]===i).sort((a,b)=>a.price-b.price)[0];if(!m)break;delete S.owners[m.id];p.money+=Math.floor(m.price/2);sold.push(m.id);}
    if(sold.length){log("{p} ติดลบ ต้องขาย{prs}",{p:p.name,prs:sold});render();await info(T("เงินติดลบ!"),T("{p} ขายกิจการคืนธนาคารครึ่งราคา: {prs}",{p:esc(p.name),prs:sold}));}
  }
}

const QUIZ_PROV={DNC:"PHR"};
function nearestStation(node){
  if(NAME[node]) return QUIZ_PROV[node]||node;
  const d=bfs(node,S.newRail); let best="BKK",bd=1e9;
  for(const s in NAME){ if(s==="DNC") continue; if((d[s]??1e9)<bd){bd=d[s];best=s;} }
  return best;
}
function pickQuiz(st){
  S.qUsed=S.qUsed||[];
  let pool=QUIZ.map((q,i)=>i).filter(i=>QUIZ[i][0]===st&&!S.qUsed.includes(i));
  if(!pool.length) pool=QUIZ.map((q,i)=>i).filter(i=>!S.qUsed.includes(i));
  if(!pool.length){ S.qUsed=[]; pool=QUIZ.map((q,i)=>i); }
  const i=pool[Math.floor(Math.random()*pool.length)]; S.qUsed.push(i); return i;
}
// คืนค่า true ถ้าตอบถูก
async function askQuiz(st,eyebrow,stake){
  const i=pickQuiz(st), [qs,q,ans,wrong,fact]=quizIn(i), p=cur();
  const opts=shuffle([ans,...wrong]);
  const head=`<p style="font-size:13px;color:var(--muted);margin:0 0 4px">${stake}</p><p style="font-size:17px;font-weight:600;line-height:1.45">${esc(q)}</p>`;
  let pick, timedOut=false;
  if(isBotTurn()){
    pick=Math.random()<0.55?ans:wrong[Math.floor(Math.random()*3)];
    await brief({eyebrow,title:T("{p} ตอบควิซ",{p:esc(p.name)}),html:head+`<p>${T("ตอบว่า")} <b>${esc(pick)}</b></p>`},1800);
  } else {
    const QT=S.qTime??5;
    const timer=QT?`<div class="qtimer" id="qtimer"><div class="qtrack"><div class="qbar" style="animation-duration:${QT}s"></div></div><b id="qsec">${QT}</b></div>`:"";
    const mp=modal({eyebrow,title:T("ควิซ!"),html:head+timer+`<div class="stack">${opts.map((o,j)=>`<button class="btn" data-val="q${j}" style="width:100%;flex:none;justify-content:flex-start;text-align:left;padding:10px 14px;line-height:1.35"><span class="gc-num" style="background:var(--surface);color:var(--ink)">${T("กขคง")[j]}</span>${esc(o)}</button>`).join("")}</div>`,buttons:[]});
    let iv=null;
    if(QT){ const r=modalResolve; let left=QT;
      iv=setInterval(()=>{ left--; if(left>0) sfx(left<=2?"hurry":"tick"); const el=$("qsec"); if(el) el.textContent=Math.max(0,left); if(left<=2){const tm=$("qtimer"); if(tm) tm.classList.add("hurry");}
        if(left<=0){ clearInterval(iv); if(modalResolve===r){ timedOut=true; closeModal(); } } },1000); }
    const k=await mp; clearInterval(iv);
    pick=k&&k[0]==="q"?opts[+k.slice(1)]:null;
  }
  const ok=pick===ans;
  log(ok?"{p} ตอบควิซถูก":(timedOut?"{p} ตอบควิซไม่ทัน":"{p} ตอบควิซผิด"),{p:p.name});
  await say({eyebrow,title:T(ok?"ถูกต้อง!":(timedOut?"หมดเวลา!":"ยังไม่ถูก")),html:`<p>${T("คำตอบคือ")} <b>${esc(ans)}</b></p><p style="color:var(--muted)">${esc(fact)}</p>`},2000);
  return ok;
}

async function playMini(eyebrow,stake,forceK,practice){
  const k=forceK||MINI_KEYS[Math.floor(Math.random()*MINI_KEYS.length)], M=MINIS[k], p=cur();
  mgPreload(k);

    const box=document.createElement("div"); box.className="mg-wrap";
    box.innerHTML=`<div class="mg-top"><b>${T(M.n)}</b><span class="mg-score" id="mgScore"></span><span class="mg-time" id="mgTime"></span></div><div class="mg-arena" id="mgArena"></div>`;
    document.body.appendChild(box);
    const res=await M.run($("mgArena"),M.goal,(sc,tx)=>{ const e=$("mgScore"); if(e){ e.textContent=tx!==undefined?tx:sc; e.style.visibility=e.textContent===""?"hidden":""; } },(sec)=>{ const e=$("mgTime"); if(e) e.textContent=sec>0?T("{n} วิ",{n:Math.ceil(sec)}):""; });
    ok=res.ok;
    box.classList.add("done"); await mgTimer(500); box.remove();
    await modal({eyebrow,title:T(ok?"ผ่าน!":"ไม่ผ่าน"),html:`<p class="mg-result ${ok?"win":"lose"}">${res.text}</p>`,buttons:[{label:T("ตกลง"),value:1,primary:true}]});
  }
  if(!practice) log(ok?"{p} ชนะมินิเกม{g}":"{p} แพ้มินิเกม{g}",{p:p.name,t:"",g:M.n});
  return ok;
}

function botPickDest(opts){
  if(opts.has(S.dest)) return S.dest;
  const d=bfs(S.dest,S.newRail), i=S.turn, p=cur();
  let best=null,bs=Infinity;
  for(const [id,path] of opts){
    let sc=(d[id]??99)*10; const t=NODES[id].t;
    if(t==="b") sc-=3; if(t==="r") sc+=3; if(t==="y"||t==="jn") sc-=2;
    if(t==="st"&&PROPS_AT(id).some(q=>S.owners[q.id]===undefined&&q.price<=p.money-10)) sc-=4;
    const gh=firstGhostOn(path); if(gh){ const kk=GHOSTS[gh.k].kind; sc+=gh.hidden?3:kk==="bad"?25:kk==="good"?-10:0; }
    if(curseOf(i)&&TEMPLES.has(id)) sc-=12;
    sc+=Math.random()*2;
    if(sc<bs){bs=sc;best=id;}
  }
  return best;
}
async function botBuy(s){
  const i=S.turn,p=cur(),props=PROPS_AT(s),bought=[];
  const late=S.month>=9&&S.year>=S.years;
  const reserve=Math.max(10,Math.round(p.money*0.2));
  const free=props.filter(q=>S.owners[q.id]===undefined).sort((a,b)=>b.profit/b.price-a.profit/a.price);
  for(const q of free){
    const completes=props.every(x=>x.id===q.id||S.owners[x.id]===i);
    const pr=priceOf(q,i); if(p.money<pr) continue;
    if(completes||(!late&&p.money-pr>=reserve)){ p.money-=pr; S.owners[q.id]=i; bought.push(q); log("{p} ซื้อ{pr} {m}",{p:p.name,pr:q.id,m:pr}); }
  }
  if(bought.length){ commit(); render(); await brief({eyebrow:T("แวะ{st}",{st:s}),title:T("{p} ซื้อกิจการ",{p:esc(p.name)}),html:`<div class="gc-row" style="justify-content:${bought.length===1?"center":"flex-start"}">${bought.map(q=>`<div class="gc-col">${propCard(q)}</div>`).join("")}</div>`},1900); }
}

async function botUseCard(){

  else if(has("pass")){k="pass";arg=S.players.map((q,j)=>({j,m:q.money})).filter(o=>o.j!==i&&!q_curse(o.j)).sort((a,b)=>b.m-a.m)[0]?.j; if(arg===undefined) k=null;}
  else if(has("hsr")&&dist>15) k="hsr";

  else if(has("exp")&&dist>4) k="exp";

  else if(has("mob")){const near=S.players.map((q,j)=>({j,v:d[q.node]??99})).filter(o=>o.j!==i&&o.v<=6).sort((a,b)=>a.v-b.v)[0]; if(near){k="mob";arg=near.j;}}
  else if(has("loan")&&p.money<10) k="loan";
  else if(has("takeover")){ const mine=new Set(PROPS.filter(q=>S.owners[q.id]===i).map(q=>q.s)); const t=takeoverList().filter(q=>mine.has(q.s)&&p.money>=q.price*2+30)[0]; if(t){k="takeover";arg=t.id;} }
  if(!k&&has("swap")){ const best=S.players.map((q,j)=>({j,v:d[q.node]??99})).filter(o=>o.j!==i).sort((a,b)=>a.v-b.v)[0]; if(best&&best.v+8<=dist){k="swap";arg=best.j;} }
  if(!k&&has("steal")&&Math.random()<0.6){ const t=S.players.map((q,j)=>({j,n:q.cards.length})).filter(o=>o.j!==i&&o.n>=2).sort((a,b)=>b.n-a.n)[0]; if(t){k="steal";arg=t.j;} }
  if(!k&&has("hex")&&Math.random()<0.5){ const j=richestOther(i); if(j>=0&&assets(j)>assets(i)){k="hex";arg=j;} }
  if(!k&&has("tax")){ const j=richestOther(i); if(j>=0&&assets(j)>assets(i)) k="tax"; }
  if(!k&&has("conv")&&p.cards.length<=3) k="conv";

    case "plane": log("{p} เหมาเครื่องบินไป{st}",{p:p.name,st:S.dest}); await teleport(S.dest,true); return "moved";
    case "drive": log("{p} ขับเอง {n} ช่อง",{p:p.name,n:arg}); commit(); return arg;
    case "pass": S.players[arg].curse=p.curse; p.curse=null; log("{p} ย้ายคำสาปไปให้{q}",{p:p.name,q:S.players[arg].name}); break;
    case "sexp": S.tf.nDice=3; S.tf.rail=true; log("{p} จอดตุ๊กตุ๊กขึ้น{it}",{p:p.name,it:"sexp"}); break;
    case "hsr": S.tf.nDice=5; S.tf.rail=true; log("{p} จอดตุ๊กตุ๊กขึ้น{it}",{p:p.name,it:"hsr"}); break;
    case "exp": S.tf.nDice=2; S.tf.rail=true; log("{p} จอดตุ๊กตุ๊กขึ้น{it}",{p:p.name,it:"exp"}); break;
    case "mob": S.skip[arg]=true; log("{p} ส่งม็อบไปปิดถนน{q}",{p:p.name,q:S.players[arg].name}); break;
    case "viral":{ const q=PROPS.filter(x=>S.owners[x.id]===i).sort((a,b)=>b.profit-a.profit)[0]; p.money+=q.profit; log("{pr}ของ{p} ดังในโซเชียล รับ {m}",{pr:q.id,p:p.name,m:q.profit}); break; }
    case "lotto":{ const r=p.lucky?6:rnd(6); p.lucky=false; if(r===6){p.money+=30;log("{p} ถูกลอตเตอรี่ รับ {m}",{p:p.name,m:30});} else {p.money-=1;log("{p} ซื้อลอตเตอรี่ไม่ถูก เสีย {m}",{p:p.name,m:1});} break; }

function ownersOf(filter,per){
  const out=[];
  S.players.forEach((p,k)=>{const n=PROPS.filter(q=>S.owners[q.id]===k&&filter(q)).length; if(n) out.push([k,n*per,n]);});
  return out;
}

const reportTitle=rep=>T("ปิดงบปีที่ {y}",{y:rep.year});
const reportBody=rep=>rep.rows?reportHTML(rep.rows):rep.html;
async function yearClose(){
  const rows=S.players.map((p,k)=>{
    let prof=0; const mono=[];
    for(const s in NAME){const props=PROPS_AT(s); if(!props.length) continue; const own=props.filter(q=>S.owners[q.id]===k); if(!own.length) continue;
      const sum=own.reduce((t,q)=>t+q.profit,0); if(own.length===props.length){prof+=sum*2;mono.push(s);} else prof+=sum;}
    if(hasTre(k,"silk")) prof+=5;
    if(hasTre(k,"fossil")) prof+=2*PROPS.filter(q=>S.owners[q.id]===k&&q.t===TOUR).length;
    p.money+=prof; return {k,prof,mono};
  });
  S.players.forEach(q=>{ if(q.loan){ q.money-=q.loan; log("{p} คืนเงินกู้ {m}",{p:q.name,m:q.loan}); q.loan=0; } });
  log("ปิดงบปีที่ {y} ทุกกิจการจ่ายกำไร",{y:S.year});
  rows.forEach(r=>r.a=assets(r.k));
  S.report={id:Date.now()+"-"+S.year,year:S.year,rows};
  ON.seenReport=S.report.id;
  render();
  await modal({eyebrow:monthN(11),title:reportTitle(S.report),html:reportBody(S.report)});
}

async function shrinkImage(file){
  const bmp=await createImageBitmap(file); const W=720,H=960;
  const sc=Math.max(W/bmp.width,H/bmp.height), w=bmp.width*sc, h=bmp.height*sc;
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  c.getContext("2d").drawImage(bmp,(W-w)/2,(H-h)/2,w,h);
  return await new Promise(r=>c.toBlob(b=>r(b),"image/webp",0.86));
}
async function manageArt(){
  const [assets,db]=await Promise.all([window.claude?.use?.("assets")??null, window.claude?.use?.("db")??null]);
  const missing=ALL_ART_IDS.filter(id=>!(ART.map[id]&&ART.map[id].url));
  const html=`<p>${T("มีภาพแล้ว")} <b>${ALL_ART_IDS.length-missing.length}/${ALL_ART_IDS.length}</b></p>
    ${assets&&db?`<p>เลือกไฟล์ภาพที่เจนไว้ทีเดียวหลายไฟล์ได้ (เลือกทั้งโฟลเดอร์ rotfai_cards ได้เลย) เกมดูรหัสจากชื่อไฟล์ เช่น card_P01_00001_.png ถ้ามีหลายไฟล์รหัสเดียวกัน ไฟล์ที่เลือกทีหลังจะใช้แทน</p>
    <input class="art-file" type="file" id="artFiles" multiple accept="image/png,image/jpeg,image/webp"><p class="note" id="artProg"></p>`
    :`<p>${T("อัปโหลดได้เฉพาะเจ้าของเกมหรือคนที่ได้สิทธิ์ Can edit ที่ล็อกอินอยู่")}</p>`}
    ${missing.length?`<p class="note">${T("ยังขาด:")} ${missing.join(", ")}</p>`:""}`;
  const p=modal({title:T("ภาพการ์ด"),html,buttons:[{label:T("ปิด"),value:null,primary:true}]});
  const input=$("artFiles");
  if(input) input.onchange=async()=>{
    const files=[...input.files]; const prog=$("artProg"); const add={}; let ok=0,skip=0,fail=0;
    input.disabled=true;
    for(const f of files){
      const m=f.name.match(/card_([PDIGE]\d{2})/i);
      if(!m||!ALL_ART_IDS.includes(m[1].toUpperCase())){skip++;continue;}
      const id=m[1].toUpperCase();
      if(prog) prog.textContent=`กำลังอัปโหลด ${id} (${ok+fail+1}/${files.length})…`;
      try{ const blob=await shrinkImage(f); const r=await assets.upload(blob); add[id]={id:r.id,url:r.url}; ok++; }
      catch(e){ fail++; }
    }
    if(ok){
      try{ const cur=await db.doc("art/cards").get(); await db.doc("art/cards").set({...(cur.exists?cur.data():{}),...add}); }
      catch(e){ fail+=ok; ok=0; }
    }
    if(prog) prog.textContent=`เสร็จแล้ว: อัปโหลด ${ok} ภาพ${skip?` · ข้าม ${skip} ไฟล์ (ชื่อไม่ตรงรูปแบบ card_XXX)`:""}${fail?` · ไม่สำเร็จ ${fail}`:""}`;
    input.disabled=false; input.value="";
  };
  await p;
}

async function initOnline(){

  ON.db=db; ON.user=user;

function genCode(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<4;i++)s+=A[Math.floor(Math.random()*A.length)];return s;}

  ON.ref=null; ON.meta=null; ON.handledTurn=null; ON.seenMove=null; ON.seenReport=null; ON.shownOver=false; ON.seenLog=0;

}

async function roomList(){
  let rooms=[]; let profs={};
  let resolve; const done=new Promise(r=>resolve=r);
  const draw=async()=>{
    const ids=[...new Set(rooms.flatMap(r=>(r.seats||[]).map(s=>s.uid)))];
    profs=ids.length?await ON.user.profiles(ids):{};
    if(!ON.listUnsub) return;
    const open=rooms.filter(r=>r.status==="lobby"||(r.status==="play"&&(r.seats||[]).some(s=>s.uid===ON.me)));
    const html=`<div class="stack"><button class="mode-btn primary" data-val="create"><b>${T("สร้างห้องใหม่")}</b><span>${T("ได้รหัสห้อง 4 ตัวให้เพื่อนกดเข้า")}</span></button></div>
      <div class="field"><div class="label">${T("ห้องที่เปิดอยู่")}</div><div class="stack">${open.length?open.map(r=>{const host=(r.seats||[])[0];const mine=(r.seats||[]).some(s=>s.uid===ON.me);return `<button class="room" data-val="join:${esc(r.code)}"><span class="rn">${esc(r.code)}</span><span><span class="rm">${r.status==="play"?T("กำลังเล่น")+" · ":""}${(r.seats||[]).length}/4 · ${T("ห้องของ{p}",{p:esc((host&&profs[host.uid]?.name)||T("เพื่อน"))})}</span></span><span class="pick" style="display:inline-flex;align-items:center;min-height:36px">${T(mine?"กลับเข้า":"เข้าร่วม")}</span></button>`;}).join(""):`<p class="note" style="margin:0">${T("ยังไม่มีห้อง สร้างห้องแล้วบอกรหัสให้เพื่อน")}</p>`}</div></div>`;
    modal({eyebrow:T("เล่นออนไลน์"),title:T("เลือกห้อง"),html,buttons:[{label:T("กลับ"),value:"back"}]}).then(v=>{if(v!==undefined)resolve(v);});
  };
  ON.listUnsub=ON.db.collection("games").where("status","in",["lobby","play"]).limit(50).onSnapshot(snap=>{
    rooms=snap.docs.map(d=>d.data()).filter(Boolean).sort((a,b)=>(b.created||0)-(a.created||0)); draw();
  },()=>{rooms=[];draw();});
  const v=await done;
  if(ON.listUnsub){ON.listUnsub();ON.listUnsub=null;}
  if(v==="back") return home();
  if(v==="create") return createRoom();
  if(typeof v==="string"&&v.startsWith("join:")) return joinRoom(v.slice(5));
  return home();

async function createRoom(){
  const code=genCode(); const ref=ON.db.doc("games/"+code);
  try{ await ref.set({code,status:"lobby",host:ON.me,created:Date.now(),years:1,seats:[{uid:ON.me,co:defaultCo(0)}],rev:0}); }
  catch(e){ await info(T("สร้างห้องไม่ได้"),T(e&&e.code==="invalid_argument"?"บัญชีนี้ยังไม่มีสิทธิ์แก้ไข ให้เจ้าของแชร์แบบ Editor":"ลองใหม่อีกครั้ง")); return roomList(); }
  enterRoom(code);
}
async function joinRoom(code){
  const ref=ON.db.doc("games/"+code);
  try{
    const l=await ref.acquire({holder:ON.me,ttlMs:4000});
    if(!l.acquired){ toast(T("มีคนกำลังเข้าห้องนี้ ลองอีกครั้ง")); return roomList(); }
    const s=await ref.get();
    if(!s.exists){ toast(T("ไม่พบห้อง {c}",{c:code})); try{localStorage.removeItem("rotfai-room");}catch(e){} return roomList(); }
    const d=s.data(); const seats=[...(d.seats||[])];
    if(!seats.some(x=>x.uid===ON.me)){
      if(d.status!=="lobby"){ toast(T("ห้องนี้เริ่มเล่นไปแล้ว")); return roomList(); }
      if(seats.length>=4){ toast(T("ห้องเต็มแล้ว")); return roomList(); }
      seats.push({uid:ON.me,co:defaultCo(seats.length)});
      await ref.update({seats});
    }
  }catch(e){ toast(T("เข้าห้องไม่ได้ ลองใหม่")); return roomList(); }
  enterRoom(code);
}
function enterRoom(code){
  ON.ref=ON.db.doc("games/"+code);
  try{localStorage.setItem("rotfai-room",code);}catch(e){}
  if(ON.unsub) ON.unsub();
  ON.unsub=ON.ref.onSnapshot(onRoomSnap,()=>{toast(T("หลุดการเชื่อมต่อกับห้อง")); leaveOnline(); home();});
}
let lobbyDrawn=null;
async function onRoomSnap(snap){
  if(!snap.exists){ toast(T("ห้องนี้ถูกปิดแล้ว")); try{localStorage.removeItem("rotfai-room");}catch(e){} leaveOnline(); return home(); }
  const d=snap.data(); const {S:gs,...meta}=d; ON.meta=meta;
  if(d.status==="lobby"){ MODE="online"; return drawRoom(d); }
  if(!gs) return;
  lobbyDrawn=null;
  if(S&&MODE==="online"&&S.code===d.code&&(d.rev||0)<=(S.rev||0)) return; // own write or stale
  const next=JSON.parse(JSON.stringify(gs)); next.code=d.code;
  ON.applyQ=ON.applyQ.then(()=>applyRemote(next));
}
async function applyRemote(next){
  const fresh=!(S&&MODE==="online"&&S.code===next.code);
  if(!fresh&&(next.rev||0)<=(S.rev||0)) return;
  MODE="online";
  if(fresh){ closeModal(); ON.seenLog=next.logN||0; ON.seenRoll=next.lastRoll?.id; ON.seenMove=next.lastMove?.id; ON.seenReport=next.report?.id; }
  const prevLog=ON.seenLog;
  S=next;
  if(!isMyTurn()) UI={mode:"idle",opts:null,dice:[],busy:false,msg:""};
  if(!fresh&&S.lastRoll&&S.lastRoll.id!==ON.seenRoll){ ON.seenRoll=S.lastRoll.id; const lr=S.lastRoll; if(lr.kind==="ghost") await diceFX(lr.vals,T("ผีทอยได้ {d}",{d:lr.vals[0]}),`${esc(S.players[lr.p].name)}`); else { const {label}=rollLabel(lr.vals); await diceFX(lr.vals,label,esc(S.players[lr.p].name)); } }
  if(!fresh&&S.lastMove&&S.lastMove.id!==ON.seenMove){ ON.seenMove=S.lastMove.id; render(); await animateMove(S.lastMove); }
  render();
  if(!fresh){
    const n=(S.logN||0)-prevLog; for(let k=Math.min(n,S.log.length)-1;k>=0;k--){ const e=S.log[k]; toast(logText(e)); sfxLog(typeof e==="string"?e:e[0]); }
  }
  ON.seenLog=S.logN||0;
  if(S.phase==="over"){ if(!ON.shownOver) await showGameOver(); return; }
  if(!fresh&&S.report&&S.report.id!==ON.seenReport){ ON.seenReport=S.report.id; if(!modalResolve) await modal({eyebrow:monthN(11),title:S.report.rows?reportTitle(S.report):S.report.title,html:reportBody(S.report)}); }
  if(S.turn===mySeat()&&ON.handledTurn!==S.turnId) startTurn();
  else if(isBotTurn()&&ON.handledTurn!==S.turnId) botTurn();
  else if(fresh) focusNode(cur().node,false);
}
async function drawRoom(d){
  const seats=d.seats||[]; const host=d.host===ON.me; const me=seats.findIndex(s=>s.uid===ON.me);
  const profs=seats.length?await ON.user.profiles(seats.map(s=>s.uid)):{};
  if(!ON.meta||ON.meta.status!=="lobby") return;
  const focusedId=document.activeElement&&document.activeElement.id;
  const html=`${langSeg()}<p style="margin-top:10px">${T("@lobbyhint")}</p><div class="code" style="margin-top:6px">${esc(d.code)}</div>

// เพลงตามสถานการณ์: วน (main/title/ghost/last/ending) + จิงเกิลเล่นทับ (goal/giant/yearend)
const TRACKS={main:"bgm.mp3",title:"music/title.mp3",ghost:"music/ghost.mp3",last:"music/lastmonths.mp3",ending:"music/ending.mp3",goal:"music/goal.mp3",giant:"music/giant.mp3",yearend:"music/yearend.mp3"};
const STINGS=new Set(["goal","giant","yearend"]);
const MUS={bufs:{},loading:{},cur:null,want:null,src:null,g:null,sting:null,stingG:null,duckUntil:0};
function musLoad(k){
  if(MUS.bufs[k]) return Promise.resolve(MUS.bufs[k]);
  if(MUS.loading[k]) return MUS.loading[k];
  return MUS.loading[k]=fetch(TRACKS[k]).then(r=>{ if(!r.ok) throw 0; return r.arrayBuffer(); })
    .then(a=>new Promise((ok,no)=>BGM.ctx.decodeAudioData(a,ok,no))).then(b=>{ MUS.bufs[k]=b; delete MUS.loading[k]; return b; })
    .catch(()=>{ delete MUS.loading[k]; return null; });
}
// เก็บในหน่วยความจำแค่เพลงที่กำลังเล่นกับจิงเกิล (เพลงยาวถอดรหัสแล้วกินแรมมาก)
function musEvict(keep){ for(const k in MUS.bufs) if(k!==keep&&!STINGS.has(k)) delete MUS.bufs[k]; }
function musWant(){
  if(!S||S.phase==="setup") return "title";
  if(S.phase==="over") return "ending";
  if(S.players&&S.players[S.turn]&&S.players[S.turn].curse) return "ghost";
  if(S.year>=S.years&&S.month>=9) return "last";
  return "main";
}
function musUpdate(){ const k=musWant(); if(k!==MUS.want||!MUS.src) musPlay(k); }
function ramp(g,v,sec){ const t=BGM.ctx.currentTime; g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value,t); g.gain.linearRampToValueAtTime(v,t+sec); }
async function musPlay(k){
  MUS.want=k;
  if(!BGM.on||document.hidden||!actx()) return;
  try{
    if(BGM.ctx.state!=="running") await BGM.ctx.resume();
    if(MUS.cur===k&&MUS.src) return;
    const buf=await musLoad(k); if(!buf||MUS.want!==k||!BGM.on) return;
    if(MUS.cur===k&&MUS.src) return;
    const old=MUS.src, og=MUS.g;
    const s=BGM.ctx.createBufferSource(), g=BGM.ctx.createGain(); s.buffer=buf; s.loop=true; g.gain.value=0; s.connect(g); g.connect(BGM.gain); s.start();
    MUS.src=s; MUS.g=g; MUS.cur=k;
    ramp(g,performance.now()<MUS.duckUntil?0.12:1,old?1.2:0.8);
    if(old){ ramp(og,0,1.2); setTimeout(()=>{ try{old.stop();}catch(e){} try{og.disconnect();}catch(e){} },1300); }
    musEvict(k);
  }catch(e){}
}
// จิงเกิล: ลดเสียงเพลงวนลง เล่นจิงเกิล แล้วค่อยๆ กลับ (max = ตัดความยาวสูงสุดเป็นวินาที)
async function musSting(k,max){
  if(!BGM.on||document.hidden||!actx()||BGM.ctx.state!=="running") return false;
  const buf=await musLoad(k); if(!buf) return false;
  try{
    if(MUS.sting){ try{MUS.sting.stop();}catch(e){} }
    const dur=Math.min(buf.duration,max||buf.duration);
    const s=BGM.ctx.createBufferSource(), g=BGM.ctx.createGain(); s.buffer=buf; s.connect(g); g.connect(BGM.gain); g.gain.value=1.15;
    const t=BGM.ctx.currentTime; if(dur<buf.duration){ g.gain.setValueAtTime(1.15,t+dur-1.5); g.gain.linearRampToValueAtTime(0,t+dur); }
    s.start(t,0,dur); MUS.sting=s;
    MUS.duckUntil=performance.now()+dur*1000;
    if(MUS.g) ramp(MUS.g,0.12,0.3);
    setTimeout(()=>{ if(performance.now()>=MUS.duckUntil-50&&MUS.g) ramp(MUS.g,1,1.5); },dur*1000);
    return true;
  }catch(e){ return false; }
}
function musLog(t){
  if(/คนแรก/.test(t)){ musSting("goal"); return BGM.on; }
  if(/โดนสาป/.test(t)) musSting("giant");
  if(/^ปิดงบปีที่/.test(t)) musSting("yearend",22);
  return false;
}
function bgmStart(){ if(BGM.on){ MUS.cur=MUS.src?MUS.cur:null; musPlay(musWant()); ["goal","giant"].forEach(k=>setTimeout(()=>{ if(BGM.ctx) musLoad(k); },3000)); } }
function bgmStop(){
  if(!BGM.ctx) return;

  if(g) ramp(g,0,0.4); setTimeout(()=>{ try{s&&s.stop();}catch(e){} },450);
  if(MUS.sting){ try{MUS.sting.stop();}catch(e){} MUS.sting=null; }
  musEvict(null);
}
function bgmToggle(){

function tn(t0,f,d,{type="sine",v=.3,a=.005,f2=null,dest=null,vib=0}={}){

  ghost:t=>{ tn(t,420,1.1,{type:"sine",v:.14,f2:190,a:.15,vib:7}); tn(t+.05,630,1,{type:"triangle",v:.06,f2:300,a:.2,vib:5}); nz(t,.9,{f:700,f2:300,q:4,v:.06}); },
  correct:t=>{ tn(t,N(88),.12,{type:"square",v:.11}); tn(t+.1,N(93),.4,{type:"square",v:.11}); tn(t+.1,N(100),.3,{v:.06}); },
  wrong:t=>{ tn(t,150,.16,{type:"sawtooth",v:.2}); tn(t+.2,140,.3,{type:"sawtooth",v:.2}); },
  tick:t=>{ tn(t,1500,.06,{v:.35}); nz(t,.02,{f:4000,q:2,v:.2}); },
  hurry:t=>{ tn(t,2000,.07,{type:"square",v:.2}); tn(t,1000,.07,{v:.25}); },
  event:t=>{ [[79,0],[76,.18],[72,.36]].forEach(([m,at])=>{ tn(t+at,N(m),.9,{v:.11}); tn(t+at,N(m)*2.76,.4,{v:.03}); }); },
  over:t=>{ notes(t,[[67,0,.15],[72,.15,.15],[76,.3,.15],[79,.45,.3],[76,.75,.15],[79,.9,.9]],{type:"square",v:.1}); notes(t,[[48,0,.7],[53,.45,.4],[55,.9,1]],{type:"triangle",v:.16}); SOUNDS.coins(t+1.1); }
};
function sfx(name){
  if(!SFX.on||document.hidden||!SOUNDS[name]) return;
  const c=actx(); if(!c||c.state!=="running") return;
  const now=performance.now(); if(now-(SFX.last[name]||0)<90) return; SFX.last[name]=now;
  try{ SOUNDS[name](c.currentTime+.01); }catch(e){}
}
// เสียงตามบันทึกเหตุการณ์ ใช้ทั้งเครื่องที่เล่นและเครื่องเพื่อน (ออนไลน์) ให้ได้ยินเหมือนกัน
const LOG_SFX=[[/คนแรก/,"arrive"],[/ชนะมินิเกม|ชนะคำท้า/,"correct"],[/แพ้มินิเกม/,"wrong"],[/โดนสาป|ขโมย|หลงป่า|กระเป๋ารั่ว/,"ghost"],[/ใบ้หวย|เรียกทรัพย์|ทำบุญ/,"coins"],[/งานบุญ/,"card"],[/ของหายาก/,"coins"],[/บินไป|บินจาก|นั่งเรือ/,"use"],[/คลื่นแรง/,"wrong"],[/ผีโผล่|ผีออกเดิน/,"pop"],[/ตอบควิซถูก|ตอบถูก/,"correct"],[/ตอบควิซผิด|ไม่ทัน/,"wrong"],[/^ผี/,"ghost"],[/ไม่ถูก|เสีย|ติดลบ|ค่าซ่อม|จ่าย 2/,"lose"],
  [/ปิดงบปีที่/,"coins"],[/ถูกลอตเตอรี่|โบนัส|ได้ .*ล้าน|ดังในโซเชียล|รับ .*ล้าน/,"coin"],[/ซื้อ/,"buy"],[/ใช้|ขับเอง|เหมาเครื่องบิน|ส่งม็อบ/,"use"],
  [/ผี/,"ghost"],[/ได้การ์ด/,"card"],[/จุดหมายใหม่/,"dest"],[/สงกรานต์|ปีใหม่|ตรุษจีน|ฤดู|ลอยกระทง|น้ำท่วม|ฝุ่น|รางใหม่|เดือนปิดงบ/,"event"]];
let sfxQ=Promise.resolve();
function sfxLog(t){ if(musLog(t)) return; const m=LOG_SFX.find(([re])=>re.test(t)); if(m) sfxQ=sfxQ.then(()=>{ sfx(m[1]); return new Promise(r=>setTimeout(r,140)); }); }
function sfxToggle(){ SFX.on=!SFX.on; try{localStorage.setItem("rotfai-sfx",SFX.on?"on":"off");}catch(e){} if(SFX.on){ actx(); sfx("coin"); } }
document.addEventListener("click",e=>{ const b=e.target.closest&&e.target.closest("button"); if(b&&!b.disabled&&!b.closest(".dfx")) sfx("tap"); },true);

  home();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
